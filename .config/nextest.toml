[store]
dir = "target/nextest"

# The evaluator's ceiling is read from the environment when a project does not
# configure one, and the depth-budget suite pins the built-in default. An
# ambient value on a developer box or a CI runner moves every expectation in it.
#
# This table does NOT stop that, and is kept only so the intent is on record.
# cargo-nextest 0.9.132 prints `ignoring unknown configuration key: env` on every
# run and inherits the ambient value anyway; `[profile.default.env]` is rejected
# the same way. Demonstrated by setting STYLEX_MAX_EVALUATION_DEPTH=3, which
# fails the depth suite with the table in place. `cargo test` and
# `cargo llvm-cov` never read this file at all.
#
# The durable fix is for the depth tests to pin the budget where they read it
# rather than trusting the runner. Until then, do not rely on this pin.
[env]
STYLEX_MAX_EVALUATION_DEPTH = { value = "32", force = true }

[profile.default]
# Use all available cores for maximum parallelism
test-threads = "num-cpus"
# Don't abort on first failure — run all tests to get full picture
fail-fast = false
# Capture stdout/stderr and show on failure
failure-output = "immediate-final"
success-output = "never"
# Slow test detection
slow-timeout = { period = "60s", terminate-after = 2 }
# No retries by default (fast local feedback)
retries = 0

[profile.ci]
# Retry flaky tests in CI
retries = 2
# Fail on flaky tests
flaky-result = "fail"
# Show failures immediately + summary at end
failure-output = "immediate-final"
success-output = "never"
# Stricter slow test timeout in CI
slow-timeout = { period = "60s", terminate-after = 2 }
