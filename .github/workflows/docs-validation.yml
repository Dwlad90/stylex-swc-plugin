name: Docs and Config Validation

# This workflow is a fast gate for documentation and config changes. It runs
# only the Node formatter and the manifest check. It does not install Rust,
# build, run visual tests or run benchmarks.
#
# Use `paths` only. GitHub rejects a workflow that sets `paths` and
# `paths-ignore` for the same event. GitHub then records a failed run with no
# jobs on each push. Thus a pull request that changes docs and code runs this
# gate too. The cost is small.

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.json'
      - '**/*.jsonc'
      - '.oxfmtrc.json'
      - '.oxlintrc.jsonc'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Check formatting
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          setup-rust: 'false'

      - name: Check formatting
        run: pnpm exec oxfmt --check .

      - name: Check manifests
        run: ./scripts/git/version-mismatch-check.sh
