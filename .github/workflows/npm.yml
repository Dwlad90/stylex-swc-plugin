name: Publish to NPM
env:
  DEBUG: napi:*
  APP_NAME: 'rs-compiler'
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
permissions:
  contents: read
  id-token: write
  actions: read
'on':
  workflow_call:
    inputs:
      release-ref:
        description: 'Git ref (tag) that identifies the release candidate.'
        required: true
        type: string
      candidate-version:
        description: 'Version being published (matches release-ref for tag releases).'
        required: true
        type: string
      previous-version:
        description: 'Exact previous @stylexswc/rs-compiler version to use as benchmark baseline.'
        required: true
        type: string
      dry-run:
        description: 'When true, run every gate but skip npm publication.'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release-ref:
        description: 'Git ref (tag) that identifies the release candidate.'
        required: true
        type: string
      candidate-version:
        description: 'Version being published.'
        required: true
        type: string
      previous-version:
        description: 'Exact previous @stylexswc/rs-compiler version to use as benchmark baseline.'
        required: true
        type: string
      dry-run:
        description: 'When true, run every gate but skip npm publication.'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release-ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm run build --filter @stylexswc/rs-compiler -- --target x86_64-apple-darwin
          - host: windows-latest
            build: pnpm run build --filter @stylexswc/rs-compiler -- --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            build:
              pnpm run build --filter @stylexswc/rs-compiler -- --target aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: stylex-debian-builder
            dockerfile: .github/docker/debian.Dockerfile
            build: |
              corepack prepare pnpm@11.20.0 --activate
              pnpm run build --filter @stylexswc/rs-compiler -- --target x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: stylex-alpine-builder
            dockerfile: .github/docker/alpine.Dockerfile
            build: |
              corepack prepare pnpm@11.20.0 --activate
              pnpm run build --filter @stylexswc/rs-compiler -- --target x86_64-unknown-linux-musl
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm run build --filter @stylexswc/rs-compiler -- --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            docker: stylex-debian-aarch64-builder
            dockerfile: .github/docker/debian-aarch64.Dockerfile
            build: |
              corepack prepare pnpm@11.20.0 --activate
              pnpm run build --filter @stylexswc/rs-compiler -- --target aarch64-unknown-linux-gnu
        node:
          - '24.18.0'
    name: 🛠️ Build - ${{ matrix.settings.target }} - node@${{ matrix.node }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - name: Enable long path support
        run: git config --system core.longpaths true
        if: ${{ matrix.settings.host == 'windows-latest' }}
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release-ref }}
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          setup-rust: ${{ !matrix.settings.docker }}
          rust-target: ${{ matrix.settings.target }}
      - name: Cache turbo build setup
        id: turbo-cache
        uses: ./.github/actions/turbo
        with:
          cache-scope: npm-build-${{ matrix.settings.target }}
          restore-cache-scope: npm-build-${{ matrix.settings.target }}
          allow-global-fallback: 'false'
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        if: ${{ matrix.settings.target == 'armv7-unknown-linux-gnueabihf' }}
        with:
          version: 0.13.0
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Build custom Docker image
        if: ${{ matrix.settings.dockerfile }}
        run: docker build -t ${{ matrix.settings.docker }} -f ${{ matrix.settings.dockerfile }} .
      - name: Build in docker
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3.0.0
        if: ${{ matrix.settings.docker }}
        with:
          image: ${{ matrix.settings.docker }}
          options:
            '--user 0:0 -v ${{ github.workspace }}/.cargo-cache/git/db:/usr/local/cargo/git/db -v
            ${{ github.workspace }}/.cargo/registry/cache:/usr/local/cargo/registry/cache -v ${{
            github.workspace }}/.cargo/registry/index:/usr/local/cargo/registry/index -v ${{
            github.workspace }}:/build -w /build'
          run: ${{ matrix.settings.build }}
      - name: Build
        run: ${{ matrix.settings.build }}
        if: ${{ !matrix.settings.docker }}
        shell: bash
      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache.outputs.cache-key }}
      # Container builds run as `--user 0:0`, so `dist` and everything in it
      # come back owned by root. The runner user can still read those files,
      # but it cannot create the manifest inside the directory -- the write
      # below fails with "Permission denied" on exactly the docker legs.
      - name: Reclaim ownership of docker-built artifacts
        if: ${{ matrix.settings.docker }}
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" crates/stylex-rs-compiler/dist
      - name: Record candidate artifact checksums
        shell: bash
        run: |
          cd crates/stylex-rs-compiler/dist
          {
            echo "target=${{ matrix.settings.target }}"
            echo "candidate_version=${{ inputs.candidate-version }}"
            echo "release_ref=${{ inputs.release-ref }}"
            echo "files:"
            find . -type f \( -name '*.node' -o -name '*.js' -o -name '*.d.ts' \) -print | LC_ALL=C sort | while read -r file; do
              sha=$(node "$GITHUB_WORKSPACE/.github/scripts/sha256.mjs" "$file")
              echo "  ${file#./}: sha256=${sha}"
            done
          } > candidate-artifact-manifest.txt
          cat candidate-artifact-manifest.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/stylex-rs-compiler/dist
          if-no-files-found: error
  test-macOS-windows-binding:
    name: 🧪 Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          # Skip testing for aarch64-pc-windows-msvc as ARM64 binaries cannot run on x64 Windows runners
          # - host: windows-latest
          #   target: aarch64-pc-windows-msvc
          #   architecture: arm64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
        node:
          - '22.22.1'
          - '24.18.0'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - name: Enable long path support
        run: git config --system core.longpaths true
        if: ${{ matrix.settings.host == 'windows-latest' }}
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release-ref }}
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust-target: ${{ matrix.settings.target }}
          node-version: ${{ matrix.node }}
          node-architecture: ${{ matrix.settings.architecture }}
          install-recursive: 'false'
          frozen-lockfile: 'false'
      - name: Cache turbo build setup
        id: turbo-cache
        uses: ./.github/actions/turbo
        with:
          cache-scope: npm-test-bindings-${{ matrix.settings.target }}-node-${{ matrix.node }}
          restore-cache-scope: npm-build-${{ matrix.settings.target }}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/stylex-rs-compiler/dist
      - name: List artifacts
        run: ls -R crates/stylex-rs-compiler/dist
        shell: bash
      - name: Test bindings
        run: pnpm run test --filter @stylexswc/rs-compiler --only
      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache.outputs.cache-key }}
  test-linux-x64-gnu-binding:
    name: 🧪 Test bindings on Linux-x64-gnu - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: x86_64-unknown-linux-gnu
        node:
          - '22.22.1'
          - '24.18.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release-ref }}
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust-target: ${{ matrix.settings.target }}
          node-version: ${{ matrix.node }}
          install-recursive: 'false'
          frozen-lockfile: 'false'
      - name: Cache turbo build setup
        id: turbo-cache
        uses: ./.github/actions/turbo
        with:
          cache-scope: npm-test-bindings-${{ matrix.settings.target }}-node-${{ matrix.node }}
          restore-cache-scope: npm-build-${{ matrix.settings.target }}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/stylex-rs-compiler/dist
      - name: List artifacts
        run: ls -R crates/stylex-rs-compiler/dist
        shell: bash
      - name: Test bindings
        run: |
          docker run --rm -v $(pwd):/build -w /build node:${{ matrix.node }}-slim sh -c "
            npm install -g pnpm@11.20.0 &&
            pnpm run test --filter @stylexswc/rs-compiler --only
          "
      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache.outputs.cache-key }}
  test-linux-arm64-gnu-binding:
    name: 🧪 Test bindings on Linux-arm64-gnu - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-unknown-linux-gnu
        node:
          - '22.22.1'
          - '24.18.0'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release-ref }}
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          setup-rust: 'false'
          node-version: ${{ matrix.node }}
          install-recursive: 'false'
          frozen-lockfile: 'false'
      - name: Cache turbo build setup
        id: turbo-cache
        uses: ./.github/actions/turbo
        with:
          cache-scope: npm-test-bindings-${{ matrix.settings.target }}-node-${{ matrix.node }}
          restore-cache-scope: npm-build-${{ matrix.settings.target }}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/stylex-rs-compiler/dist
      - name: List artifacts
        run: ls -R crates/stylex-rs-compiler/dist
        shell: bash
      - name: Test bindings
        run: |
          docker run --rm -v $(pwd):/build -w /build node:${{ matrix.node }}-slim sh -c "
            npm install -g pnpm@11.20.0 &&
            pnpm run test --filter @stylexswc/rs-compiler --only
          "
      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache.outputs.cache-key }}
  test-linux-x64-musl-binding:
    name: 🧪 Test bindings on x86_64-unknown-linux-musl - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: x86_64-unknown-linux-musl
        node:
          - '22.22.1'
          - '24.18.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release-ref }}
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust-target: ${{ matrix.settings.target }}
          node-version: ${{ matrix.node }}
          install-recursive: 'false'
          frozen-lockfile: 'false'
      - name: Cache turbo build setup
        id: turbo-cache
        uses: ./.github/actions/turbo
        with:
          cache-scope: npm-test-bindings-${{ matrix.settings.target }}-node-${{ matrix.node }}
          restore-cache-scope: npm-build-${{ matrix.settings.target }}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/stylex-rs-compiler/dist
      - name: List artifacts
        run: ls -R crates/stylex-rs-compiler/dist
        shell: bash
      - name: Test bindings
        run: |
          docker run --rm -e CI=true -v $(pwd):/build -w /build node:${{ matrix.node }}-alpine sh -c "
            npm install -g pnpm@11.20.0 &&
            pnpm install --frozen-lockfile &&
            pnpm run test --filter @stylexswc/rs-compiler --only
          "
      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache.outputs.cache-key }}
  # Paired release gate. Each leg compares the exact previous npm package with
  # the candidate artifact built earlier in this workflow, in the same process
  # on the same runner. Cross-run historical data is updated in the aggregate
  # job only and is not the release verdict.
  benchmark:
    name: 📊 Paired benchmark on ${{ matrix.settings.target }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
            label: 'x86_64-pc-windows-msvc'
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
            label: 'aarch64-apple-darwin'
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
            label: 'x86_64-apple-darwin (Rosetta)'
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            architecture: x64
            label: 'x86_64-unknown-linux-gnu'
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            architecture: arm64
            label: 'aarch64-unknown-linux-gnu'
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            architecture: x64
            label: 'x86_64-unknown-linux-musl'
            container: 'node:24.18.0-alpine'
        node:
          - '24.18.0'
    runs-on: ${{ matrix.settings.host }}
    permissions:
      contents: read
    env:
      BENCHMARK_SUBJECT_SCHEMA_VERSION: 1
      PREVIOUS_VERSION: ${{ inputs.previous-version }}
      CANDIDATE_VERSION: ${{ inputs.candidate-version }}
      RELEASE_REF: ${{ inputs.release-ref }}
      TARGET: ${{ matrix.settings.target }}
    steps:
      - name: Enable long path support
        run: git config --system core.longpaths true
        if: ${{ matrix.settings.host == 'windows-latest' }}
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release-ref }}
      - name: Setup environment
        if: ${{ !matrix.settings.container }}
        uses: ./.github/actions/setup
        with:
          setup-rust: 'false'
          node-version: ${{ matrix.node }}
          node-architecture: ${{ matrix.settings.architecture }}
          install-recursive: 'false'
          frozen-lockfile: 'false'
      - name: Download candidate artifact
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/stylex-rs-compiler/dist
      - name: Verify candidate artifact manifest
        shell: bash
        run: |
          test -f crates/stylex-rs-compiler/dist/candidate-artifact-manifest.txt
          test -f crates/stylex-rs-compiler/dist/index.js
          native_count=$(find crates/stylex-rs-compiler/dist -maxdepth 1 -name '*.node' | wc -l)
          if [ "$native_count" -ne 1 ]; then
            echo "::error::Expected exactly one native binding, found $native_count"
            exit 1
          fi
      - name: Install previous npm package (native runner)
        if: ${{ !matrix.settings.container }}
        shell: bash
        env:
          BASE_DIR: ${{ runner.temp }}/stylex-base-npm
        run: |
          rm -rf "$BASE_DIR"
          mkdir -p "$BASE_DIR"
          cd "$BASE_DIR"
          npm init -y >/dev/null
          npm install "@stylexswc/rs-compiler@${PREVIOUS_VERSION}" --no-save --no-audit --no-fund --ignore-scripts
          resolved=$(node -p "require('@stylexswc/rs-compiler/package.json').version")
          if [ "$resolved" != "$PREVIOUS_VERSION" ]; then
            echo "::error::Installed previous version '$resolved' does not match '$PREVIOUS_VERSION'"
            exit 1
          fi
          pkg_dir="$BASE_DIR/node_modules/@stylexswc/rs-compiler"
          # Loading the module forces napi's platform selector to resolve the
          # correct optional dependency for $TARGET. A missing or wrong-triple
          # binary throws here rather than silently passing the .node presence
          # check that a mis-resolved optionalDependency would still satisfy.
          if ! node -e "const m = require('@stylexswc/rs-compiler'); if (typeof m.transform !== 'function') process.exit(2);"; then
            echo "::error::Previous package failed to load native binding for $TARGET"
            find "$pkg_dir" -type f | head -50
            exit 1
          fi
          echo "BASE_PACKAGE_DIR=$pkg_dir" >> "$GITHUB_ENV"
      - name: Run paired revisions benchmark (native runner)
        id: paired-bench-native
        if: ${{ !matrix.settings.container }}
        shell: bash
        run: |
          pnpm run --filter=@stylexswc/rs-compiler bench:revisions -- \
            --base "$BASE_PACKAGE_DIR" \
            --candidate "$GITHUB_WORKSPACE/crates/stylex-rs-compiler" \
            --base-label "npm@${PREVIOUS_VERSION}" \
            --candidate-label "candidate@${CANDIDATE_VERSION}" \
            --rounds 10 \
            --seed 1
      - name: Evaluate paired verdict (native runner)
        if: ${{ !matrix.settings.container }}
        shell: bash
        run: |
          pnpm run --filter=@stylexswc/rs-compiler bench:verdict -- \
            --primary benchmark/results/revisions-raw-stats.v1.json \
            --output-json benchmark/results/compare-revisions.verdict.v1.json \
            --summary-md benchmark/results/compare-revisions.summary.md \
            --retry-output benchmark/results/revisions-retry-raw-stats.v1.json \
            --retry-seed 2
      # Absolute p95 ceilings are only valid on the canonical target, so the
      # budget runs on x86_64-unknown-linux-gnu alone. While budget.json is
      # pending calibration this reports observations and never blocks; once
      # ceilings are committed a breach fails this leg and, through the
      # publish job's dependency on `benchmark`, blocks publication.
      - name: Check absolute p95 budget (canonical target)
        if:
          ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' && !matrix.settings.container }}
        shell: bash
        run: |
          pnpm run --filter=@stylexswc/rs-compiler bench:budget -- \
            --raw benchmark/results/revisions-raw-stats.v1.json \
            --budget benchmark/budget.json \
            --output-json benchmark/results/budget-report.v1.json \
            --summary-md benchmark/results/budget-report.md
      # Single-subject measurement of the candidate. Writes output.json, which
      # the aggregate job appends to the trend series on the `benchmarks`
      # branch. Not a comparison -- the release gate is the paired run above.
      - name: Measure trend-series datapoint (native runner)
        if: ${{ !matrix.settings.container }}
        shell: bash
        run: pnpm run --filter=@stylexswc/rs-compiler bench
      - name: Run paired benchmark inside musl container
        id: paired-bench-musl
        if: ${{ matrix.settings.container }}
        shell: bash
        env:
          IMAGE: ${{ matrix.settings.container }}
        run: |
          docker run --rm -e CI=true \
            -e PREVIOUS_VERSION -e CANDIDATE_VERSION -e RELEASE_REF -e TARGET \
            -v $(pwd):/build -w /build "$IMAGE" sh -eu -c '
              apk add --no-cache git bash >/dev/null
              npm install -g pnpm@11.20.0 >/dev/null
              pnpm install --frozen-lockfile
              base_dir=/tmp/stylex-base-npm
              rm -rf "$base_dir"
              mkdir -p "$base_dir"
              cd "$base_dir"
              npm init -y >/dev/null
              npm install "@stylexswc/rs-compiler@${PREVIOUS_VERSION}" --no-save --no-audit --no-fund --ignore-scripts
              resolved=$(node -p "require(\"@stylexswc/rs-compiler/package.json\").version")
              if [ "$resolved" != "$PREVIOUS_VERSION" ]; then
                echo "Installed previous version $resolved does not match $PREVIOUS_VERSION"
                exit 1
              fi
              pkg_dir="$base_dir/node_modules/@stylexswc/rs-compiler"
              if ! node -e "const m = require(\"@stylexswc/rs-compiler\"); if (typeof m.transform !== \"function\") process.exit(2);"; then
                echo "Previous package failed to load native binding for $TARGET"
                find "$pkg_dir" -type f | head -50
                exit 1
              fi
              cd /build
              pnpm run --filter=@stylexswc/rs-compiler bench:revisions -- \
                --base "$pkg_dir" \
                --candidate /build/crates/stylex-rs-compiler \
                --base-label "npm@${PREVIOUS_VERSION}" \
                --candidate-label "candidate@${CANDIDATE_VERSION}" \
                --rounds 10 \
                --seed 1
              pnpm run --filter=@stylexswc/rs-compiler bench:verdict -- \
                --primary benchmark/results/revisions-raw-stats.v1.json \
                --output-json benchmark/results/compare-revisions.verdict.v1.json \
                --summary-md benchmark/results/compare-revisions.summary.md \
                --retry-output benchmark/results/revisions-retry-raw-stats.v1.json \
                --retry-seed 2
              pnpm run --filter=@stylexswc/rs-compiler bench
            '
      # The musl container runs as root and creates benchmark/results, which is
      # gitignored and so does not exist in the checkout. Every host step below
      # writes into that directory, so hand it back before they run.
      - name: Reclaim ownership of container-written results
        if: >-
          ${{ !cancelled() && matrix.settings.container && steps.paired-bench-musl.outcome ==
          'success' }}
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" crates/stylex-rs-compiler
      # These steps intentionally survive a failing verdict -- a detected
      # regression must still publish its evidence -- but are gated on the
      # paired benchmark having produced results. An earlier failure leaves
      # nothing to bundle and would otherwise report as extra failures that
      # bury the real one.
      - name: Record benchmark identity and checksums
        if: >-
          ${{ !cancelled() && (steps.paired-bench-native.outcome == 'success' ||
          steps.paired-bench-musl.outcome == 'success') }}
        shell: bash
        env:
          TARGET_LABEL: ${{ matrix.settings.label }}
          NODE_VERSION: ${{ matrix.node }}
          SUBJECT_SCHEMA_VERSION: '1'
        run: |
          set -eu
          cd crates/stylex-rs-compiler
          native_binary=$(find dist -maxdepth 1 -name '*.node' | head -n 1)
          if [ -z "$native_binary" ]; then
            echo "::error::No native binary in candidate dist"
            exit 1
          fi
          NATIVE_SHA=$(node "$GITHUB_WORKSPACE/.github/scripts/sha256.mjs" "$native_binary")
          NATIVE_BASENAME=$(basename "$native_binary")
          export NATIVE_SHA NATIVE_BASENAME
          mkdir -p benchmark/results
          node -e "
            const fs = require('fs');
            const identity = {
              schemaVersion: 1,
              target: process.env.TARGET,
              targetLabel: process.env.TARGET_LABEL,
              node: process.env.NODE_VERSION,
              releaseRef: process.env.RELEASE_REF,
              candidateVersion: process.env.CANDIDATE_VERSION,
              previousVersion: process.env.PREVIOUS_VERSION,
              runId: process.env.GITHUB_RUN_ID,
              nativeBinary: process.env.NATIVE_BASENAME,
              nativeSha256: process.env.NATIVE_SHA,
              subjectSchemaVersion: Number(process.env.SUBJECT_SCHEMA_VERSION),
            };
            fs.writeFileSync('benchmark/results/release-benchmark-identity.v1.json', JSON.stringify(identity, null, 2) + '\n');
          "
      - name: Prepare bounded artifacts
        if: >-
          ${{ !cancelled() && (steps.paired-bench-native.outcome == 'success' ||
          steps.paired-bench-musl.outcome == 'success') }}
        shell: bash
        run: |
          cd crates/stylex-rs-compiler/benchmark/results
          for required in revisions-raw-stats.v1.json compare-revisions.verdict.v1.json compare-revisions.summary.md release-benchmark-identity.v1.json; do
            if [ ! -f "$required" ]; then
              echo "::error::Missing required artifact: $required"
              exit 1
            fi
          done
          test "$(wc -c < compare-revisions.verdict.v1.json)" -le 1048576
          test "$(wc -c < compare-revisions.summary.md)" -le 1048576
          test "$(wc -c < release-benchmark-identity.v1.json)" -le 4096
          raw_files=(revisions-raw-stats.v1.json)
          if [ -f revisions-retry-raw-stats.v1.json ]; then
            raw_files+=(revisions-retry-raw-stats.v1.json)
          fi
          tar -czf paired-release-raw.tar.gz "${raw_files[@]}"
          test "$(wc -c < paired-release-raw.tar.gz)" -le 104857600
      - name: Upload paired release report
        if: >-
          ${{ !cancelled() && (steps.paired-bench-native.outcome == 'success' ||
          steps.paired-bench-musl.outcome == 'success') }}
        uses: actions/upload-artifact@v7
        with:
          name: paired-release-report-${{ matrix.settings.target }}
          path: |
            crates/stylex-rs-compiler/benchmark/results/compare-revisions.verdict.v1.json
            crates/stylex-rs-compiler/benchmark/results/compare-revisions.summary.md
            crates/stylex-rs-compiler/benchmark/results/release-benchmark-identity.v1.json
            crates/stylex-rs-compiler/benchmark/results/output.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload absolute budget report
        if: >-
          ${{ !cancelled() && matrix.settings.target == 'x86_64-unknown-linux-gnu' &&
          !matrix.settings.container && steps.paired-bench-native.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: paired-release-budget
          path: |
            crates/stylex-rs-compiler/benchmark/results/budget-report.v1.json
            crates/stylex-rs-compiler/benchmark/results/budget-report.md
          # The aggregation job requires this artifact, so an absent report
          # blocks publication rather than passing unnoticed.
          if-no-files-found: error
          retention-days: 90
      - name: Upload paired release diagnostics
        if: >-
          ${{ !cancelled() && (steps.paired-bench-native.outcome == 'success' ||
          steps.paired-bench-musl.outcome == 'success') }}
        uses: actions/upload-artifact@v7
        with:
          name: paired-release-raw-${{ matrix.settings.target }}
          path: crates/stylex-rs-compiler/benchmark/results/paired-release-raw.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  # One dependent aggregation job. Validates every runnable target reported
  # exactly once, fails on any missing or failed verdict, writes the combined
  # summary, and performs one commit to the `benchmarks` branch. Matrix jobs
  # have no write permission, so no concurrent non-fast-forward pushes can
  # occur.
  benchmark-aggregate:
    name: 📊 Aggregate paired release verdicts
    needs:
      - benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPECTED_TARGETS: >-
        x86_64-pc-windows-msvc,aarch64-apple-darwin,x86_64-apple-darwin,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release-ref }}
      - name: Download all release reports
        uses: actions/download-artifact@v8
        with:
          pattern: paired-release-report-*
          path: aggregate/reports
      - name: Download absolute budget report
        uses: actions/download-artifact@v8
        with:
          name: paired-release-budget
          path: aggregate/budget
      - name: Validate absolute budget report
        env:
          BUDGET_REPORT: aggregate/budget/budget-report.v1.json
        run: node .github/scripts/validate-budget-report.mjs
      - name: Checkout benchmarks branch
        uses: actions/checkout@v7.0.1
        with:
          ref: benchmarks
          path: aggregate/pages
          fetch-depth: 1
      - name: Aggregate release verdicts and update history
        env:
          REPORTS_DIR: aggregate/reports
          PAGES_DIR: aggregate/pages
          NODE_VERSION: '24.18.0'
          REPO_URL: https://github.com/${{ github.repository }}
          RELEASE_REF: ${{ inputs.release-ref }}
          CANDIDATE_VERSION: ${{ inputs.candidate-version }}
          PREVIOUS_VERSION: ${{ inputs.previous-version }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node .github/scripts/aggregate-release-benchmarks.mjs
      - name: Publish combined summary
        run: cat aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Push updated history
        working-directory: aggregate/pages
        env:
          RELEASE_REF: ${{ inputs.release-ref }}
        run: |
          if git diff --quiet; then
            echo "No history changes to push"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(benchmarks): record ${RELEASE_REF} release results"
          git push origin benchmarks
      - name: Upload aggregate summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-release-aggregate
          path: |
            aggregate/summary.md
            aggregate/summary.json
          if-no-files-found: error
          retention-days: 90
  publish:
    name: 📦 Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: publish-approval
    needs:
      - build
      - benchmark
      - benchmark-aggregate
      - test-macOS-windows-binding
      - test-linux-x64-gnu-binding
      - test-linux-arm64-gnu-binding
      - test-linux-x64-musl-binding
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release-ref }}
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Cache turbo build setup
        id: turbo-cache-build-public-packages
        uses: ./.github/actions/turbo
        with:
          cache-scope: npm-publish-build-public-packages
          restore-cache-scope: npm-build-x86_64-unknown-linux-gnu
          allow-global-fallback: 'false'
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: crates/stylex-rs-compiler/artifacts
      - name: Verify candidate artifact checksums against benchmark identities
        env:
          ARTIFACTS_DIR: crates/stylex-rs-compiler/artifacts
        run: node .github/scripts/verify-release-artifacts.mjs
      - name: Move artifacts
        run: pnpm exec turbo run artifacts --filter @stylexswc/rs-compiler --continue
      - name: Move and list artifacts
        run: |
          mkdir -p crates/stylex-rs-compiler/dist

          yes | cp -rf crates/stylex-rs-compiler/artifacts/bindings-aarch64-apple-darwin/{index,transform}.* crates/stylex-rs-compiler/dist/

          ls -R crates/stylex-rs-compiler/dist/*
      - name: Build all public packages
        run: |
          pnpm run build --filter "{./packages/*}" --filter "!@stylexswc/*swc*" --filter "!{./crates/*}" --only --continue
      - name: Check artifacts
        run:
          pnpm run check:artifacts --filter "{./packages/*}" --filter "!@stylexswc/*swc*" --filter
          "!{./crates/*}" --only
      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache-build-public-packages.outputs.cache-key }}
      - name: Publish (dry-run)
        if: ${{ inputs.dry-run }}
        run: |
          echo "::notice::Dry-run mode: skipping npm publish. All gates passed."
      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: |
          if [[ "${{ inputs.release-ref }}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "${{ inputs.release-ref }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            pnpm publish -r --access public --no-git-checks --report-summary
          elif [[ "${{ inputs.release-ref }}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+-.*$ ]] || [[ "${{ inputs.release-ref }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-.*$ ]]; then
            NPM_CONFIG_TAG=next pnpm publish -r --tag next --access public --no-git-checks --report-summary
            git diff
            cat ./pnpm-publish-summary.json
          else
            echo "Not a release, skipping publish"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
  cleanup:
    needs: [publish]
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: 🧹 Cleanup Caches
        run: |
          REF="${{ inputs.release-ref }}"

          run_id=$(gh workflow run cleanup.yaml \
            --ref $REF \
            --field reference=$REF \
            --repo ${{ github.repository }}) || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
