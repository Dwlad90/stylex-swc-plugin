name: Pull Request Validation

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - edited
  push:
    branches:
      - develop
  schedule:
    # Keep develop branch Turbo cache warm so PR runs can restore from it.
    - cron: '0 3 * * *'

env:
  APP_NAME: 'rs-compiler'
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  CHECKOUT_REF: >-
    ${{
      github.event_name == 'schedule'
      && 'refs/heads/develop'
      || github.event.pull_request.number != null
      && format('refs/pull/{0}/merge', github.event.pull_request.number)
      || github.ref
    }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build-public-packages:
    name: Build all public packages
    if: >-
      (github.event_name != 'schedule' || github.ref_name == 'develop') &&
      (github.event.pull_request.number == null || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          fetch-tags: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust-target: 'wasm32-wasip1'

      - name: Cache turbo build setup
        id: turbo-cache
        uses: ./.github/actions/turbo
        with:
          cache-scope: build-public-packages
          restore-cache-scope: build-public-packages
          allow-global-fallback: 'false'

      - name: Build all public packages
        run: pnpm run build --filter "{./packages/*}..." --filter "{./crates/*}..." --continue

      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache.outputs.cache-key }}

  basic-checks:
    name: ${{ matrix.check.name }}
    if: >-
      (github.event_name != 'schedule' || github.ref_name == 'develop') &&
      (github.event.pull_request.number == null || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        check:
          - id: conventional-commits
            name: Validate conventional commits
            command: pnpm exec commitlint --from=$(git merge-base origin/develop HEAD)
          - id: version-mismatch
            name: Version mismatch check
            command: ./scripts/git/version-mismatch-check.sh
          - id: format-check
            name: Check formatting
            command: pnpm run format:check
          - id: benchmark-reporter-tests
            name: Test benchmark reporter
            command: node --test .github/scripts/render-benchmark-report.test.mjs
          # Disabled for now; re-enable when we want the dependency graph
          # enforced on every PR. `pnpm run deps:check:typescript` still works
          # locally in the meantime.
          # - id: dependency-graph
          #   name: Dependency graph guards
          #   command: |
          #     pnpm dedupe --check
          #     pnpm exec syncpack lint
          #     pnpm run deps:check:typescript
      fail-fast: false
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          fetch-tags: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          setup-rust: ${{ matrix.check.id == 'format-check' }}

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  checks:
    name: ${{ matrix.check.name }}
    if: >-
      (github.event_name != 'schedule' || github.ref_name == 'develop') &&
      (github.event.pull_request.number == null || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04-arm
    needs:
      - build-public-packages
      - basic-checks
    strategy:
      fail-fast: false
      matrix:
        check:
          - id: lint-check
            name: Lint Node.js code
            command: pnpm run lint:node
          - id: lint-type-aware
            name: Lint Node.js code (type-aware)
            command: pnpm run lint:type-aware
          - id: lint-check-rust
            name: Lint Rust code
            command: pnpm run lint:rust
          - id: typecheck
            name: Typecheck code
            command: pnpm run typecheck
          - id: tests-nodejs
            name: Tests Node.js
            command:
              pnpm run test --filter="{./packages/*}" --filter="{./apps/*}"
              --filter="@stylexswc/rs-compiler"
          - id: tests-rust
            name: Tests Rust code
            command: pnpm exec turbo run test:crates:workspace:regular --filter="//"
          - id: tests-rust-doc
            name: Tests Rust doc
            command: pnpm exec turbo run test:crates:workspace:doc --filter="//"
          - id: tests-coverage
            name: Tests Rust coverage
            command: pnpm exec turbo run test:coverage:workspace --filter="//"
          - id: check-artifacts
            name: Check artifacts
            command: pnpm run check:artifacts --filter "{./packages/*}" --filter "{./crates/*}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          fetch-tags: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust-target: 'wasm32-wasip1'

      - name: Install nightly Rust toolchain
        if: matrix.check.id == 'tests-coverage'
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: nightly

      - name: Install cargo-nextest
        if: matrix.check.id == 'tests-rust'
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov and nightly
        if: matrix.check.id == 'tests-coverage'
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Cache turbo build setup
        id: turbo-cache
        uses: ./.github/actions/turbo
        with:
          cache-scope: checks-${{ matrix.check.id }}
          restore-cache-scope: build-public-packages

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache.outputs.cache-key }}

  playwright-image:
    name: Resolve Playwright image
    if: >-
      (github.event_name != 'schedule' || github.ref_name == 'develop') &&
      (github.event.pull_request.number == null || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.detect.outputs.image }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 1
          fetch-tags: false
          sparse-checkout: |
            pnpm-lock.yaml
            .github/actions/playwright-version
          sparse-checkout-cone-mode: false

      - name: Detect Playwright version
        id: detect
        uses: ./.github/actions/playwright-version

  visual-tests:
    name: Run visual comparison tests
    if: >-
      (github.event_name != 'schedule' || github.ref_name == 'develop') &&
      (github.event.pull_request.number == null || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04-arm
    needs:
      - build-public-packages
      - basic-checks
      - playwright-image
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          fetch-tags: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          setup-rust: 'false'

      - name: Cache turbo build setup
        id: turbo-cache
        uses: ./.github/actions/turbo
        with:
          cache-scope: visual-tests
          restore-cache-scope: build-public-packages
          allow-global-fallback: 'false'

      - name: Verify public package build cache
        env:
          RESTORED_TURBO_CACHE_KEY: ${{ steps.turbo-cache.outputs.preferred-cache-matched-key }}
        run: |
          if [ -z "$RESTORED_TURBO_CACHE_KEY" ]; then
            echo "::error::No build-public-packages Turbo cache was restored."
            exit 1
          fi

          echo "Restored $RESTORED_TURBO_CACHE_KEY"

      - name: Run visual comparison tests
        run:
          pnpm run test:visual --filter="./apps/*" --filter="!@stylexswc/rollup-large-example"
          --continue

      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache.outputs.cache-key }}

  benchmark:
    name: Run benchmarks
    if: >-
      (github.event_name != 'schedule' || github.ref_name == 'develop') &&
      (github.event.pull_request.number == null || !github.event.pull_request.draft)
    needs:
      - build-public-packages
      - basic-checks
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      BENCHMARK_SUBJECT_SCHEMA_VERSION: 1
      BENCHMARK_TARGET: aarch64-unknown-linux-gnu
      # PR-side benchmark history, deliberately kept separate from the
      # release-to-release history in npm.yml (which lives in the `benchmarks`
      # branch under dev/bench/releases). The `benchmark-pr-` namespace exists so
      # no release-side key can ever prefix-match the fallbacks below: PRs are
      # only ever compared against develop and other PRs, never against a release.
      # `median` is the metric version. The action matches previous results by
      # bench name only, with no unit check, and cannot convert ops/sec to ms —
      # so old `benchmarkjs` entries would be compared against median latency and
      # report a ~3272x regression. Bump this segment on any metric/unit change to
      # start a fresh series instead of poisoning the old one.
      BENCHMARK_CACHE_KEY_NAMESPACE: benchmark-pr-median-aarch64-unknown-linux-gnu-node24.18.0
      BENCHMARK_CACHE_KEY_PREFIX: >-
        benchmark-pr-median-aarch64-unknown-linux-gnu-node24.18.0-${{
          github.event.pull_request.number != null
          && format('pr-{0}', github.event.pull_request.number)
          || github.ref_name
        }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          fetch-tags: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust-target: 'aarch64-unknown-linux-gnu'

      - name: Cache turbo build setup
        id: turbo-cache
        uses: ./.github/actions/turbo
        with:
          cache-scope: benchmark
          restore-cache-scope: build-public-packages

      - name: Download previous benchmark data
        id: benchmark-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ./cache
          key: ${{ env.BENCHMARK_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.BENCHMARK_CACHE_KEY_PREFIX }}-
            ${{ env.BENCHMARK_CACHE_KEY_NAMESPACE }}-develop-
            ${{ env.BENCHMARK_CACHE_KEY_NAMESPACE }}-

      - name: Report missing baseline
        if: ${{ steps.benchmark-cache-restore.outputs.cache-matched-key == '' }}
        run: |
          echo "::warning::No PR-side benchmark baseline was restored; results" \
            "are informational for this run."

      - name: Run historical benchmarks
        run: pnpm run bench --filter @stylexswc/rs-compiler

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: 'crates/stylex-rs-compiler/benchmark/results/output.json'
          external-data-json-path: './cache/benchmark-data.json'
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '120%'
          fail-threshold: '150%'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The key must be unique per run. Keyed on run_attempt alone it resolved to
      # `<prefix>-1` on every run, so after the first save every later one failed
      # with "Unable to reserve cache" and the baseline stayed frozen at whatever
      # the first run measured. restore-keys above picks the newest prefix match.
      - name: Save benchmark cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ./cache
          key: ${{ env.BENCHMARK_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Resolve paired benchmark identities
        id: paired-identities
        env:
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git fetch --no-tags origin develop

          candidate_sha=$(git rev-parse HEAD)
          if [[ -n "$PR_MERGE_SHA" && "$candidate_sha" != "$PR_MERGE_SHA" ]]; then
            echo "::error::Checked-out candidate $candidate_sha does not match PR merge SHA $PR_MERGE_SHA."
            exit 1
          fi

          base_sha=$(git merge-base origin/develop "$candidate_sha")
          node_abi=$(node -p 'process.versions.modules')
          toolchain_hash=$(
            for file in rust-toolchain.toml Cargo.toml Cargo.lock \
              crates/stylex-rs-compiler/Cargo.toml pnpm-lock.yaml; do
              printf '%s\0' "$file"
              git show "$base_sha:$file"
            done | shasum -a 256 | cut -d ' ' -f 1
          )

          echo "candidate-sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "base-sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "node-abi=$node_abi" >> "$GITHUB_OUTPUT"
          echo "toolchain-hash=$toolchain_hash" >> "$GITHUB_OUTPUT"

      - name: Restore immutable base subject
        id: base-subject-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/stylex-base-subject
          key: >-
            stylex-base-subject-v${{ env.BENCHMARK_SUBJECT_SCHEMA_VERSION }}-${{
            steps.paired-identities.outputs.base-sha }}-${{ env.BENCHMARK_TARGET }}-abi${{
            steps.paired-identities.outputs.node-abi }}-${{
            steps.paired-identities.outputs.toolchain-hash }}

      - name: Validate restored base subject
        if: steps.base-subject-cache.outputs.cache-hit == 'true'
        env:
          BASE_SHA: ${{ steps.paired-identities.outputs.base-sha }}
          NODE_ABI: ${{ steps.paired-identities.outputs.node-abi }}
          TOOLCHAIN_HASH: ${{ steps.paired-identities.outputs.toolchain-hash }}
          BASE_SUBJECT: ${{ runner.temp }}/stylex-base-subject
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const subject = process.env.BASE_SUBJECT;
          const expected = {
            schemaVersion: Number(process.env.BENCHMARK_SUBJECT_SCHEMA_VERSION),
            baseSha: process.env.BASE_SHA,
            target: process.env.BENCHMARK_TARGET,
            nodeAbi: process.env.NODE_ABI,
            toolchainHash: process.env.TOOLCHAIN_HASH,
          };
          const actual = JSON.parse(fs.readFileSync(path.join(subject, 'manifest.json'), 'utf8'));
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Base subject manifest mismatch: ${JSON.stringify(actual)}`);
          }
          for (const required of ['package.json', 'dist/index.js', 'dist/transform.js']) {
            if (!fs.statSync(path.join(subject, required)).isFile()) {
              throw new Error(`Base subject is missing ${required}`);
            }
          }
          const native = fs.readdirSync(path.join(subject, 'dist')).filter(name => name.endsWith('.node'));
          if (native.length !== 1) throw new Error('Base subject must contain exactly one native binding');
          NODE

      - name: Build base subject in isolated worktree
        if: steps.base-subject-cache.outputs.cache-hit != 'true'
        env:
          BASE_SHA: ${{ steps.paired-identities.outputs.base-sha }}
          NODE_ABI: ${{ steps.paired-identities.outputs.node-abi }}
          TOOLCHAIN_HASH: ${{ steps.paired-identities.outputs.toolchain-hash }}
          BASE_SUBJECT: ${{ runner.temp }}/stylex-base-subject
          BASE_WORKTREE: ${{ runner.temp }}/stylex-base-worktree
        run: |
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          pnpm --dir "$BASE_WORKTREE" install --recursive --frozen-lockfile --link-workspace-packages
          pnpm --dir "$BASE_WORKTREE" run build --filter @stylexswc/rs-compiler -- \
            --target "$BENCHMARK_TARGET"

          mkdir -p "$BASE_SUBJECT/node_modules"
          cp "$BASE_WORKTREE/crates/stylex-rs-compiler/package.json" "$BASE_SUBJECT/package.json"
          cp -R "$BASE_WORKTREE/crates/stylex-rs-compiler/dist" "$BASE_SUBJECT/dist"
          cp -R -L "$BASE_WORKTREE/crates/stylex-rs-compiler/node_modules/picomatch" \
            "$BASE_SUBJECT/node_modules/picomatch"

          BASE_SUBJECT="$BASE_SUBJECT" BASE_SHA="$BASE_SHA" NODE_ABI="$NODE_ABI" \
            TOOLCHAIN_HASH="$TOOLCHAIN_HASH" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = {
            schemaVersion: Number(process.env.BENCHMARK_SUBJECT_SCHEMA_VERSION),
            baseSha: process.env.BASE_SHA,
            target: process.env.BENCHMARK_TARGET,
            nodeAbi: process.env.NODE_ABI,
            toolchainHash: process.env.TOOLCHAIN_HASH,
          };
          fs.writeFileSync(
            path.join(process.env.BASE_SUBJECT, 'manifest.json'),
            `${JSON.stringify(manifest, null, 2)}\n`
          );
          NODE

      - name: Save immutable base subject
        if: steps.base-subject-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/stylex-base-subject
          key: ${{ steps.base-subject-cache.outputs.cache-primary-key }}

      - name: Run paired revision benchmark
        if: github.event_name == 'pull_request'
        env:
          BASE_SUBJECT: ${{ runner.temp }}/stylex-base-subject
        run: |
          test -f crates/stylex-rs-compiler/dist/index.js
          test "$(find crates/stylex-rs-compiler/dist -maxdepth 1 -name '*.node' | wc -l)" -eq 1
          pnpm run --filter=@stylexswc/rs-compiler bench:revisions -- \
            --base "$BASE_SUBJECT" \
            --candidate "$GITHUB_WORKSPACE/crates/stylex-rs-compiler" \
            --rounds 10 \
            --seed 1

      - name: Evaluate paired revision benchmark
        if: github.event_name == 'pull_request'
        run: |
          pnpm run --filter=@stylexswc/rs-compiler bench:verdict -- \
            --primary benchmark/results/revisions-raw-stats.v1.json \
            --output-json benchmark/results/compare-revisions.verdict.v1.json \
            --summary-md benchmark/results/compare-revisions.summary.md \
            --retry-output benchmark/results/revisions-retry-raw-stats.v1.json \
            --retry-seed 2

      - name: Record paired benchmark identity
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ steps.paired-identities.outputs.base-sha }}
          CANDIDATE_SHA: ${{ steps.paired-identities.outputs.candidate-sha }}
          NODE_ABI: ${{ steps.paired-identities.outputs.node-abi }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const identity = {
            schemaVersion: 1,
            runId: process.env.GITHUB_RUN_ID,
            prNumber: Number(process.env.PR_NUMBER),
            candidateSha: process.env.CANDIDATE_SHA,
            baseSha: process.env.BASE_SHA,
            target: process.env.BENCHMARK_TARGET,
            nodeAbi: process.env.NODE_ABI,
            subjectSchemaVersion: Number(process.env.BENCHMARK_SUBJECT_SCHEMA_VERSION),
          };
          fs.writeFileSync(
            'crates/stylex-rs-compiler/benchmark/results/paired-benchmark-identity.v1.json',
            `${JSON.stringify(identity, null, 2)}\n`
          );
          NODE

      - name: Prepare bounded benchmark artifacts
        if: always() && github.event_name == 'pull_request'
        working-directory: crates/stylex-rs-compiler/benchmark/results
        run: |
          test -f revisions-raw-stats.v1.json
          test -f compare-revisions.verdict.v1.json
          test -f compare-revisions.summary.md
          test -f paired-benchmark-identity.v1.json
          test "$(stat -c %s compare-revisions.verdict.v1.json)" -le 1048576
          test "$(stat -c %s compare-revisions.summary.md)" -le 1048576
          test "$(stat -c %s paired-benchmark-identity.v1.json)" -le 4096

          raw_files=(revisions-raw-stats.v1.json)
          if [[ -f revisions-retry-raw-stats.v1.json ]]; then
            raw_files+=(revisions-retry-raw-stats.v1.json)
          fi
          tar -czf paired-benchmark-raw.tar.gz "${raw_files[@]}"
          test "$(stat -c %s paired-benchmark-raw.tar.gz)" -le 104857600

      - name: Upload paired benchmark report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: paired-benchmark-report
          path: |
            crates/stylex-rs-compiler/benchmark/results/compare-revisions.verdict.v1.json
            crates/stylex-rs-compiler/benchmark/results/paired-benchmark-identity.v1.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload paired benchmark diagnostics
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: paired-benchmark-raw
          path: crates/stylex-rs-compiler/benchmark/results/paired-benchmark-raw.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache.outputs.cache-key }}

  pr-validation:
    name: PR Validation
    if:
      ${{ always() && (github.event_name != 'schedule' || github.ref_name == 'develop') &&
      (github.event.pull_request.number == null || !github.event.pull_request.draft) }}
    needs:
      - build-public-packages
      - basic-checks
      - checks
      - playwright-image
      - visual-tests
      - benchmark
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Verify validation jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq .

          for job in basic-checks checks build-public-packages playwright-image visual-tests benchmark; do
            result=$(echo "$NEEDS_JSON" | jq -r --arg job "$job" '.[$job].result')
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Validation job '$job' finished with status '$result'."
              exit 1
            fi
          done

          echo "All validation jobs passed"

  dependabot:
    runs-on: ubuntu-24.04-arm
    needs: [pr-validation]
    if:
      github.event_name != 'schedule' && github.event.pull_request.number != null &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Set PR information as environment variables
        env:
          PR_NUMBER_VALUE: ${{ github.event.pull_request.number }}
          PR_URL_VALUE: ${{ github.event.pull_request.html_url }}
          PR_HEAD_REF_VALUE: ${{ github.event.pull_request.head.ref }}
          UPDATE_TYPE_VALUE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_TYPE_VALUE: ${{ steps.metadata.outputs.dependency-type }}
        run: |
          echo "PR_NUMBER=${PR_NUMBER_VALUE}" >> $GITHUB_ENV
          echo "PR_URL=${PR_URL_VALUE}" >> $GITHUB_ENV
          echo "PR_HEAD_REF=${PR_HEAD_REF_VALUE}" >> $GITHUB_ENV
          echo "UPDATE_TYPE=${UPDATE_TYPE_VALUE}" >> $GITHUB_ENV
          echo "DEPENDENCY_TYPE=${DEPENDENCY_TYPE_VALUE}" >> $GITHUB_ENV

      - name: Add labels based on dependency type
        run: |
          if [[ "$DEPENDENCY_TYPE" == "direct:production" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "production"
          else
            gh pr edit "$PR_NUMBER" --add-label "development"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve Pull Request
        run: |
          gh pr review "$PR_NUMBER" --approve -R ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        if: |
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor')
        uses: ./.github/actions/gitconfig

      - name: Auto-merge for safe updates
        if: |
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: |
          echo "Auto-merging PR..."
          git checkout develop
          git pull origin develop
          git fetch origin "$PR_HEAD_REF"
          git merge origin/"$PR_HEAD_REF"
          git push origin develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR if auto-merge is skipped
        if: |
          (steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
            steps.metadata.outputs.update-type != 'version-update:semver-minor')
        run: |
          REASON="The update type ($UPDATE_TYPE) requires manual review"
          gh pr comment "$PR_NUMBER" -b "⚠️ This PR wasn't automatically merged: $REASON"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
