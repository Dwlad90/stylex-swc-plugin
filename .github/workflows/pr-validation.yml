name: Pull Request Validation

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - edited
  push:
    branches:
      - develop
  schedule:
    # Keep develop branch Turbo cache warm so PR runs can restore from it.
    - cron: '0 3 * * *'

env:
  APP_NAME: 'rs-compiler'
  CI: true
  # Belt and braces with lefthook's own CI detection. A runner that blocked on
  # /dev/tty waiting for the commitizen prompt would hang with no useful error.
  LEFTHOOK: '0'
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  CHECKOUT_REF: >-
    ${{
      github.event_name == 'schedule'
      && 'refs/heads/develop'
      || github.event.pull_request.number != null
      && format('refs/pull/{0}/merge', github.event.pull_request.number)
      || github.ref
    }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build-public-packages:
    name: Build all public packages
    if: >-
      (github.event_name != 'schedule' || github.ref_name == 'develop') &&
      (github.event.pull_request.number == null || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          fetch-tags: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust-target: 'wasm32-wasip1'

      - name: Cache turbo build setup
        id: turbo-cache
        uses: ./.github/actions/turbo
        with:
          cache-scope: build-public-packages
          restore-cache-scope: build-public-packages
          allow-global-fallback: 'false'

      - name: Build all public packages
        run: pnpm run build --filter "{./packages/*}..." --filter "{./crates/*}..." --continue

      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache.outputs.cache-key }}

  basic-checks:
    name: ${{ matrix.check.name }}
    if: >-
      (github.event_name != 'schedule' || github.ref_name == 'develop') &&
      (github.event.pull_request.number == null || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        check:
          - id: conventional-commits
            name: Validate conventional commits
            command: pnpm exec commitlint --from=$(git merge-base origin/develop HEAD)
          - id: version-mismatch
            name: Version mismatch check
            command: ./scripts/git/version-mismatch-check.sh
          - id: format-check
            name: Check formatting
            command: pnpm run format:check
          # `shellcheck` used to run in the pre-commit hook and nowhere else, so
          # a `--no-verify` push meant shell scripts were never linted at all.
          # A bypass should cost you later feedback, never no feedback.
          - id: lint-shell
            name: Lint shell scripts
            command: pnpm run lint:shell
          # A malformed `lefthook.yml` should fail a PR rather than a
          # developer's next commit. Note this is pure JSON-schema validation --
          # it does not catch semantic errors, so it is a floor, not a gate.
          - id: hooks-validate
            name: Validate git hook config
            command: pnpm run hooks:validate
          # The pre-push counterpart. Same reasoning as shellcheck above: a
          # check that lives only in a hook is silent for anyone who bypasses.
          - id: lint-dead-exports
            name: Lint dead exports
            command: pnpm run lint:dead-exports
          # Every CI-side script suite, not just the reporter: `test:scripts`
          # also covers the release artifact parsers and the release shell
          # scripts, which the full `test` run alone would not guard on the
          # paths that use them.
          - id: ci-script-tests
            name: Test CI scripts
            command: pnpm run test:scripts
          # Disabled for now; re-enable when we want the dependency graph
          # enforced on every PR. `pnpm run deps:check:typescript` still works
          # locally in the meantime.
          # - id: dependency-graph
          #   name: Dependency graph guards
          #   command: |
          #     pnpm dedupe --check
          #     pnpm exec syncpack lint
          #     pnpm run deps:check:typescript
      fail-fast: false
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          fetch-tags: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          setup-rust: ${{ matrix.check.id == 'format-check' }}

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  checks:
    name: ${{ matrix.check.name }}
    if: >-
      (github.event_name != 'schedule' || github.ref_name == 'develop') &&
      (github.event.pull_request.number == null || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04-arm
    needs:
      - build-public-packages
      - basic-checks
    strategy:
      fail-fast: false
      matrix:
        check:
          - id: lint-check
            name: Lint Node.js code
            command: pnpm run lint:node
          - id: lint-type-aware
            name: Lint Node.js code (type-aware)
            command: pnpm run lint:type-aware
          - id: lint-check-rust
            name: Lint Rust code
            command: pnpm run lint:rust
          - id: typecheck
            name: Typecheck code
            command: pnpm run typecheck
          - id: tests-nodejs
            name: Tests Node.js
            command:
              pnpm run test --filter="{./packages/*}" --filter="{./apps/*}"
              --filter="@stylexswc/rs-compiler"
          - id: tests-rust
            name: Tests Rust code
            command: pnpm exec turbo run test:crates:workspace:regular --filter="//"
          - id: tests-rust-doc
            name: Tests Rust doc
            command: pnpm exec turbo run test:crates:workspace:doc --filter="//"
          - id: tests-coverage
            name: Tests Rust coverage
            command: pnpm exec turbo run test:coverage:workspace --filter="//"
          - id: check-artifacts
            name: Check artifacts
            command: pnpm run check:artifacts --filter "{./packages/*}" --filter "{./crates/*}"
          # The oracle every expectation in the CSS-value corpus was derived
          # from, and until now nothing ran it. It sits here rather than in a
          # hook because it needs a built `dist/` and a Node toolchain -- a real
          # cost to put in front of every commit, and this job already has both.
          # It fails on exactly two things, and both get quieter the longer
          # nobody looks: an expectation that stopped holding, and a refusal
          # family no row reached. The ordering check beside it is the third
          # harness, and it is here rather than in the nightly sweep because it
          # is the one that guards a class name: a condition-key ordering
          # divergence is what the collation dependency was taken on to close.
          # Measured at ~2.5s, ~8s and ~2s on an Apple Silicon laptop, so the
          # step adds nothing worth weighing against the matrix around it. The
          # generated sweeps -- the shorthand alphabet and the prototype surface
          # -- run on the nightly schedule instead, see `parity-sweep`.
          - id: parity
            name: CSS value parity
            # The build restores from the `build-public-packages` cache; both
            # harnesses load the compiler from `dist/`, not from the Rust
            # sources, so a report without it is about nothing.
            command: |
              pnpm run build --filter=@stylexswc/rs-compiler
              pnpm run --filter=@stylexswc/rs-compiler parity
              pnpm run --filter=@stylexswc/rs-compiler parity:positions
              pnpm run --filter=@stylexswc/rs-compiler fuzz:pseudo-order
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          fetch-tags: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust-target: 'wasm32-wasip1'

      - name: Install nightly Rust toolchain
        if: matrix.check.id == 'tests-coverage'
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: nightly

      - name: Install cargo-nextest
        if: matrix.check.id == 'tests-rust'
        uses: taiki-e/install-action@v2.85.9
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov and nightly
        if: matrix.check.id == 'tests-coverage'
        uses: taiki-e/install-action@v2.85.9
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Cache turbo build setup
        id: turbo-cache
        uses: ./.github/actions/turbo
        with:
          cache-scope: checks-${{ matrix.check.id }}
          restore-cache-scope: build-public-packages

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache.outputs.cache-key }}

  # The generated half of the parity corpus, on the nightly schedule only.
  #
  # Two sweeps, both generated and both nightly for the same reason. The
  # shorthand one crosses an alphabet with itself -- ~154k subjects, two compiler
  # runs each, measured at ~97s against the curated harness's ~2.5s -- and forty
  # times the cost buys nothing per commit: a value-splitter defect shows up when
  # a value pass or the alphabet changes. The prototype one is cheap by
  # comparison (~2s, ~330 subjects) but guards the same kind of thing from the
  # other end: it reads every method off the language, so what moves it is an
  # engine upgrade or a widened guard rather than a commit. Both fail on the one
  # number a reader acts on, the divergent rows nothing accounts for.
  parity-sweep:
    name: Generated parity sweeps
    if: github.event_name == 'schedule' && github.ref_name == 'develop'
    runs-on: ubuntu-24.04-arm
    # The only job here that bounds itself, because it is the only one whose
    # work is a cross product rather than a fixed list: widen the alphabet and
    # the subject count grows with its square. Measured at ~97s, so 20 minutes
    # is roughly twelve times headroom and still an order of magnitude below
    # the 360-minute default a runaway would otherwise sit on overnight.
    timeout-minutes: 20
    needs:
      - build-public-packages
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Spelled out rather than taken from `CHECKOUT_REF`, which the jobs
          # around it use because they also serve pull requests. This one runs
          # on the nightly schedule alone, where that variable resolves to this
          # very ref -- so the indirection buys nothing and costs something: a
          # cache-writing job whose checkout ref is an expression reads as a
          # cache-poisoning sink to CodeQL, and a literal closes the path.
          ref: 'refs/heads/develop'
          fetch-depth: 0
          fetch-tags: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust-target: 'wasm32-wasip1'

      - name: Cache turbo build setup
        id: turbo-cache
        uses: ./.github/actions/turbo
        with:
          cache-scope: parity-sweep
          restore-cache-scope: build-public-packages

      - name: Build the compiler
        run: pnpm run build --filter=@stylexswc/rs-compiler

      - name: Run the shorthand split sweep
        run: pnpm run --filter=@stylexswc/rs-compiler fuzz:shorthand

      - name: Run the prototype sweep
        run: pnpm run --filter=@stylexswc/rs-compiler fuzz:prototypes

      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache.outputs.cache-key }}

  playwright-image:
    name: Resolve Playwright image
    if: >-
      (github.event_name != 'schedule' || github.ref_name == 'develop') &&
      (github.event.pull_request.number == null || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.detect.outputs.image }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 1
          fetch-tags: false
          sparse-checkout: |
            pnpm-lock.yaml
            .github/actions/playwright-version
          sparse-checkout-cone-mode: false

      - name: Detect Playwright version
        id: detect
        uses: ./.github/actions/playwright-version

  visual-tests:
    name: Run visual comparison tests
    if: >-
      (github.event_name != 'schedule' || github.ref_name == 'develop') &&
      (github.event.pull_request.number == null || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04-arm
    needs:
      - build-public-packages
      - basic-checks
      - playwright-image
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          fetch-tags: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          setup-rust: 'false'

      - name: Cache turbo build setup
        id: turbo-cache
        uses: ./.github/actions/turbo
        with:
          cache-scope: visual-tests
          restore-cache-scope: build-public-packages
          allow-global-fallback: 'false'

      - name: Verify public package build cache
        env:
          RESTORED_TURBO_CACHE_KEY: ${{ steps.turbo-cache.outputs.preferred-cache-matched-key }}
        run: |
          if [ -z "$RESTORED_TURBO_CACHE_KEY" ]; then
            echo "::error::No build-public-packages Turbo cache was restored."
            exit 1
          fi

          echo "Restored $RESTORED_TURBO_CACHE_KEY"

      - name: Run visual comparison tests
        run:
          pnpm run test:visual --filter="./apps/*" --filter="!@stylexswc/rollup-large-example"
          --continue

      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache.outputs.cache-key }}

  benchmark:
    name: Run benchmarks
    if: >-
      (github.event_name != 'schedule' || github.ref_name == 'develop') &&
      (github.event.pull_request.number == null || !github.event.pull_request.draft)
    needs:
      - build-public-packages
      - basic-checks
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      BENCHMARK_SUBJECT_SCHEMA_VERSION: 1
      BENCHMARK_TARGET: aarch64-unknown-linux-gnu
      # PR-side benchmark history, deliberately kept separate from the
      # release-to-release history in npm.yml (which lives in the `benchmarks`
      # branch under dev/bench/releases). The `benchmark-pr-` namespace exists so
      # no release-side key can ever prefix-match the fallbacks below: PRs are
      # only ever compared against develop and other PRs, never against a release.
      # `median` is the metric version. The action matches previous results by
      # bench name only, with no unit check, and cannot convert ops/sec to ms —
      # so old `benchmarkjs` entries would be compared against median latency and
      # report a ~3272x regression. Bump this segment on any metric/unit change to
      # start a fresh series instead of poisoning the old one.
      BENCHMARK_CACHE_KEY_NAMESPACE: benchmark-pr-median-aarch64-unknown-linux-gnu-node24.18.0
      BENCHMARK_CACHE_KEY_PREFIX: >-
        benchmark-pr-median-aarch64-unknown-linux-gnu-node24.18.0-${{
          github.event.pull_request.number != null
          && format('pr-{0}', github.event.pull_request.number)
          || github.ref_name
        }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          fetch-tags: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust-target: 'aarch64-unknown-linux-gnu'

      - name: Cache turbo build setup
        id: turbo-cache
        uses: ./.github/actions/turbo
        with:
          cache-scope: benchmark
          restore-cache-scope: build-public-packages

      - name: Download previous benchmark data
        id: benchmark-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ./cache
          key: ${{ env.BENCHMARK_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.BENCHMARK_CACHE_KEY_PREFIX }}-
            ${{ env.BENCHMARK_CACHE_KEY_NAMESPACE }}-develop-
            ${{ env.BENCHMARK_CACHE_KEY_NAMESPACE }}-

      # Cache eviction must be visible rather than looking like a clean
      # comparison. With no restored series github-action-benchmark has nothing
      # to compare against and cannot raise an alert at all, so this run only
      # seeds the series -- the warning says so instead of leaving an empty
      # comparison to be read as a pass.
      - name: Report missing baseline
        if: ${{ steps.benchmark-cache-restore.outputs.cache-matched-key == '' }}
        run: |
          echo "::warning::No PR-side benchmark baseline was restored; this run" \
            "seeds a new series and performs no comparison."
          {
            echo "> **No benchmark baseline restored.** This run seeds a new"
            echo "> trend series; no comparison was performed."
          } >> "$GITHUB_STEP_SUMMARY"

      # Measures this revision once, single-subject. The result is only a
      # datapoint; the step below hands it to github-action-benchmark, which
      # appends it to the trend series and compares against the restored
      # baseline. Advisory only -- the blocking check is the paired benchmark
      # further down, which measures base and candidate on this same runner.
      - name: Measure trend-series datapoint
        run: pnpm run bench --filter @stylexswc/rs-compiler

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: 'crates/stylex-rs-compiler/benchmark/results/output.json'
          external-data-json-path: './cache/benchmark-data.json'
          # Advisory only. This is a cross-run comparison against a cached
          # datapoint from another machine (~16% noise on hosted Linux, ~34% on
          # macOS), so it must never gate. It also runs before the paired
          # benchmark, so failing here skips the real gate. Commenting needs
          # pull-requests: write, which this job deliberately does not hold --
          # benchmark-report.yml posts the PR comment from the default branch.
          fail-on-alert: false
          comment-on-alert: false
          summary-always: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '120%'
          fail-threshold: '150%'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The note below is the text a reader sees. Do not repeat it here.
      # It runs only when a baseline was restored, because without one the
      # action writes no comparison for the note to qualify.
      - name: Explain the trend-series comparison
        if: ${{ steps.benchmark-cache-restore.outputs.cache-matched-key != '' }}
        run: |
          {
            echo "> **The Benchmark table above compares two machines.** Each"
            echo "> row puts this run beside a datapoint that a different"
            echo "> runner measured, so the ratio holds runner noise (~16% on"
            echo "> hosted Linux, ~34% on macOS) as well as any code change."
            echo "> Two runs of one commit have differed by 9% here."
            echo ">"
            echo "> The table is advisory and never gates. The gate is the"
            echo "> paired revision benchmark below, which measures base and"
            echo "> candidate on this runner in one process."
          } >> "$GITHUB_STEP_SUMMARY"

      # The key must be unique per run: cache entries are immutable, so a key
      # that repeats across runs (e.g. `run_attempt` alone) makes every save
      # after the first fail with "Unable to reserve cache" and freezes the
      # baseline. restore-keys above picks the newest prefix match.
      - name: Save benchmark cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ./cache
          key: ${{ env.BENCHMARK_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Resolve paired benchmark identities
        id: paired-identities
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git fetch --no-tags origin develop

          candidate_sha=$(git rev-parse HEAD)

          # The candidate is whatever `refs/pull/N/merge` resolved to at
          # checkout -- that commit is what actually gets benchmarked, so it is
          # the identity we record.
          #
          # Do not gate on `github.event.pull_request.merge_commit_sha`. GitHub
          # recomputes the test-merge asynchronously, so the webhook payload
          # routinely carries the previous value while the ref already points at
          # the new one. Failing on that mismatch kills runs that measured the
          # correct commit. Staleness is adjudicated downstream by
          # benchmark-report.yml, which re-reads live PR state and drops a
          # report whose head has moved.
          #
          # Only pull_request runs check out a merge ref; push and schedule runs
          # check out the develop tip, where HEAD has a single parent.
          head_sha=$candidate_sha
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            parent_count=$(($(git rev-list --parents -n 1 HEAD | wc -w) - 1))
            if [[ "$parent_count" -ne 2 ]]; then
              echo "::error::Expected a two-parent merge commit at HEAD; CHECKOUT_REF" \
                "must resolve to refs/pull/N/merge (got $parent_count)."
              exit 1
            fi

            # The PR head that was actually merged into the benchmarked tree.
            # This is the one identity the trusted reporter can rederive from
            # the workflow_run event, so it is what binds the artifact to this
            # PR revision -- see render-benchmark-report.mjs.
            merged_head_sha=$(git rev-parse 'HEAD^2')
            head_sha=$merged_head_sha
            if [[ -n "$PR_HEAD_SHA" && "$merged_head_sha" != "$PR_HEAD_SHA" ]]; then
              echo "::warning::Merge ref was rebuilt: HEAD^2 $merged_head_sha is not the" \
                "event's head $PR_HEAD_SHA. Benchmarking the ref as checked out."
            elif [[ -n "$PR_MERGE_SHA" && "$candidate_sha" != "$PR_MERGE_SHA" ]]; then
              echo "::warning::Event payload merge SHA $PR_MERGE_SHA is stale;" \
                "benchmarking the current merge ref $candidate_sha."
            fi
          fi

          base_sha=$(git merge-base origin/develop "$candidate_sha")
          node_abi=$(node -p 'process.versions.modules')
          toolchain_hash=$(
            for file in rust-toolchain.toml Cargo.toml Cargo.lock \
              crates/stylex-rs-compiler/Cargo.toml pnpm-lock.yaml; do
              printf '%s\0' "$file"
              git show "$base_sha:$file"
            done | shasum -a 256 | cut -d ' ' -f 1
          )

          echo "candidate-sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base-sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "node-abi=$node_abi" >> "$GITHUB_OUTPUT"
          echo "toolchain-hash=$toolchain_hash" >> "$GITHUB_OUTPUT"

      - name: Restore immutable base subject
        id: base-subject-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/stylex-base-subject
          key: >-
            stylex-base-subject-v${{ env.BENCHMARK_SUBJECT_SCHEMA_VERSION }}-${{
            steps.paired-identities.outputs.base-sha }}-${{ env.BENCHMARK_TARGET }}-abi${{
            steps.paired-identities.outputs.node-abi }}-${{
            steps.paired-identities.outputs.toolchain-hash }}

      - name: Validate restored base subject
        if: steps.base-subject-cache.outputs.cache-hit == 'true'
        env:
          BASE_SHA: ${{ steps.paired-identities.outputs.base-sha }}
          NODE_ABI: ${{ steps.paired-identities.outputs.node-abi }}
          TOOLCHAIN_HASH: ${{ steps.paired-identities.outputs.toolchain-hash }}
          BASE_SUBJECT: ${{ runner.temp }}/stylex-base-subject
        run: node .github/scripts/base-subject.mjs verify

      - name: Build base subject in isolated worktree
        if: steps.base-subject-cache.outputs.cache-hit != 'true'
        env:
          BASE_SHA: ${{ steps.paired-identities.outputs.base-sha }}
          NODE_ABI: ${{ steps.paired-identities.outputs.node-abi }}
          TOOLCHAIN_HASH: ${{ steps.paired-identities.outputs.toolchain-hash }}
          BASE_SUBJECT: ${{ runner.temp }}/stylex-base-subject
          BASE_WORKTREE: ${{ runner.temp }}/stylex-base-worktree
        run: |
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          pnpm --dir "$BASE_WORKTREE" install --recursive --frozen-lockfile --link-workspace-packages
          pnpm --dir "$BASE_WORKTREE" run build --filter @stylexswc/rs-compiler -- \
            --target "$BENCHMARK_TARGET"

          mkdir -p "$BASE_SUBJECT/node_modules"
          cp "$BASE_WORKTREE/crates/stylex-rs-compiler/package.json" "$BASE_SUBJECT/package.json"
          cp -R "$BASE_WORKTREE/crates/stylex-rs-compiler/dist" "$BASE_SUBJECT/dist"
          cp -R -L "$BASE_WORKTREE/crates/stylex-rs-compiler/node_modules/picomatch" \
            "$BASE_SUBJECT/node_modules/picomatch"

          node .github/scripts/base-subject.mjs write

      - name: Save immutable base subject
        if: steps.base-subject-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/stylex-base-subject
          key: ${{ steps.base-subject-cache.outputs.cache-primary-key }}

      - name: Run paired revision benchmark
        id: paired-bench
        if: github.event_name == 'pull_request'
        env:
          BASE_SUBJECT: ${{ runner.temp }}/stylex-base-subject
        run: |
          test -f crates/stylex-rs-compiler/dist/index.js
          test "$(find crates/stylex-rs-compiler/dist -maxdepth 1 -name '*.node' | wc -l)" -eq 1
          pnpm run --filter=@stylexswc/rs-compiler bench:revisions -- \
            --base "$BASE_SUBJECT" \
            --candidate "$GITHUB_WORKSPACE/crates/stylex-rs-compiler" \
            --rounds 10 \
            --seed 1

      - name: Evaluate paired revision benchmark
        if: github.event_name == 'pull_request'
        # PR measurements are advisory. The trusted reporter publishes a
        # reproduced regression without turning it into a required check.
        continue-on-error: true
        run: |
          pnpm run --filter=@stylexswc/rs-compiler bench:verdict -- \
            --primary benchmark/results/revisions-raw-stats.v1.json \
            --output-json benchmark/results/compare-revisions.verdict.v1.json \
            --summary-md benchmark/results/compare-revisions.summary.md \
            --retry-output benchmark/results/revisions-retry-raw-stats.v1.json \
            --retry-seed 2

      # The identity and artifact steps below intentionally survive a failing
      # verdict -- a detected regression must still publish its evidence. They
      # are gated on the paired benchmark having produced results, because an
      # earlier failure (build, sanity check, base subject) leaves nothing to
      # bundle and would otherwise report as a second, misleading failure.
      #
      # `paired-bench` itself only runs on pull_request, so its outcome being
      # `success` already implies the event -- no need to retest it here.
      - name: Record paired benchmark identity
        if: ${{ !cancelled() && steps.paired-bench.outcome == 'success' }}
        env:
          BASE_SHA: ${{ steps.paired-identities.outputs.base-sha }}
          CANDIDATE_SHA: ${{ steps.paired-identities.outputs.candidate-sha }}
          HEAD_SHA: ${{ steps.paired-identities.outputs.head-sha }}
          NODE_ABI: ${{ steps.paired-identities.outputs.node-abi }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IDENTITY_OUTPUT: crates/stylex-rs-compiler/benchmark/results/paired-benchmark-identity.v1.json
        run: node .github/scripts/record-paired-benchmark-identity.mjs

      - name: Prepare bounded benchmark artifacts
        if: ${{ !cancelled() && steps.paired-bench.outcome == 'success' }}
        working-directory: crates/stylex-rs-compiler/benchmark/results
        run: |
          test -f revisions-raw-stats.v1.json
          test -f compare-revisions.verdict.v1.json
          test -f compare-revisions.summary.md
          test -f paired-benchmark-identity.v1.json
          test "$(stat -c %s compare-revisions.verdict.v1.json)" -le 1048576
          test "$(stat -c %s compare-revisions.summary.md)" -le 1048576
          test "$(stat -c %s paired-benchmark-identity.v1.json)" -le 4096

          raw_files=(revisions-raw-stats.v1.json)
          if [[ -f revisions-retry-raw-stats.v1.json ]]; then
            raw_files+=(revisions-retry-raw-stats.v1.json)
          fi
          tar -czf paired-benchmark-raw.tar.gz "${raw_files[@]}"
          test "$(stat -c %s paired-benchmark-raw.tar.gz)" -le 104857600

      - name: Upload paired benchmark report
        if: ${{ !cancelled() && steps.paired-bench.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: paired-benchmark-report
          path: |
            crates/stylex-rs-compiler/benchmark/results/compare-revisions.verdict.v1.json
            crates/stylex-rs-compiler/benchmark/results/paired-benchmark-identity.v1.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload paired benchmark diagnostics
        if: ${{ !cancelled() && steps.paired-bench.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: paired-benchmark-raw
          path: crates/stylex-rs-compiler/benchmark/results/paired-benchmark-raw.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Save turbo build cache
        if: always()
        uses: ./.github/actions/turbo-save
        with:
          cache-key: ${{ steps.turbo-cache.outputs.cache-key }}

  pr-validation:
    name: PR Validation
    if:
      ${{ always() && (github.event_name != 'schedule' || github.ref_name == 'develop') &&
      (github.event.pull_request.number == null || !github.event.pull_request.draft) }}
    needs:
      - build-public-packages
      - basic-checks
      - checks
      - playwright-image
      - visual-tests
      - benchmark
      # Runs on the nightly schedule only, so it reports `skipped` on every pull
      # request -- which the loop below accepts. It is listed so a failing sweep
      # fails the gate rather than sitting green beside it, and it carries both
      # generated sweeps for that reason: one job to list rather than two.
      - parity-sweep
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Verify validation jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq .

          jobs="basic-checks checks build-public-packages playwright-image"
          jobs="$jobs visual-tests benchmark parity-sweep"

          for job in $jobs; do
            result=$(echo "$NEEDS_JSON" | jq -r --arg job "$job" '.[$job].result')
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Validation job '$job' finished with status '$result'."
              exit 1
            fi
          done

          echo "All validation jobs passed"

  dependabot:
    runs-on: ubuntu-24.04-arm
    needs: [pr-validation]
    if:
      github.event_name != 'schedule' && github.event.pull_request.number != null &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Set PR information as environment variables
        env:
          PR_NUMBER_VALUE: ${{ github.event.pull_request.number }}
          PR_URL_VALUE: ${{ github.event.pull_request.html_url }}
          PR_HEAD_REF_VALUE: ${{ github.event.pull_request.head.ref }}
          UPDATE_TYPE_VALUE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_TYPE_VALUE: ${{ steps.metadata.outputs.dependency-type }}
        run: |
          echo "PR_NUMBER=${PR_NUMBER_VALUE}" >> $GITHUB_ENV
          echo "PR_URL=${PR_URL_VALUE}" >> $GITHUB_ENV
          echo "PR_HEAD_REF=${PR_HEAD_REF_VALUE}" >> $GITHUB_ENV
          echo "UPDATE_TYPE=${UPDATE_TYPE_VALUE}" >> $GITHUB_ENV
          echo "DEPENDENCY_TYPE=${DEPENDENCY_TYPE_VALUE}" >> $GITHUB_ENV

      - name: Add labels based on dependency type
        run: |
          if [[ "$DEPENDENCY_TYPE" == "direct:production" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "production"
          else
            gh pr edit "$PR_NUMBER" --add-label "development"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve Pull Request
        run: |
          gh pr review "$PR_NUMBER" --approve -R ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        if: |
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor')
        uses: ./.github/actions/gitconfig

      - name: Auto-merge for safe updates
        if: |
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: |
          echo "Auto-merging PR..."
          git checkout develop
          git pull origin develop
          git fetch origin "$PR_HEAD_REF"
          git merge origin/"$PR_HEAD_REF"
          git push origin develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR if auto-merge is skipped
        if: |
          (steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
            steps.metadata.outputs.update-type != 'version-update:semver-minor')
        run: |
          REASON="The update type ($UPDATE_TYPE) requires manual review"
          gh pr comment "$PR_NUMBER" -b "⚠️ This PR wasn't automatically merged: $REASON"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
