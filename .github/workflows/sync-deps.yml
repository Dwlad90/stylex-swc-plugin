name: Sync Dependencies

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - edited
    paths:
      - '**/package.json'
      - '**/pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.ref }}
  cancel-in-progress: true

jobs:
  sync-dependencies:
    runs-on: ubuntu-24.04-arm
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Git configure
        uses: ./.github/actions/gitconfig

      # Dependabot has understood catalogs since early 2025, but an update can
      # drop an entry from `pnpm-lock.yaml` -- still declared in
      # pnpm-workspace.yaml, still referenced by a manifest, resolving to
      # nothing. The sync below reinstalls and would most likely put it back,
      # which is exactly why this runs first: "most likely, as a side effect" is
      # not a guard for the lockfile of a repository that ships native bindings,
      # and a check placed after the repair would only ever confirm that the
      # repair worked.
      #
      # Both sides come out of git rather than off disk, so no later step can
      # move them: the head commit's lockfile as dependabot wrote it, against
      # the base commit's lockfile from before the update. `fetch-depth: 0`
      # above is what makes the base commit readable here.
      #
      # The assertion lives in a script with a test suite rather than in bash
      # here, because inline workflow YAML has no seam to test through.
      #
      # `Setup pnpm` above installs with `--frozen-lockfile` on a pull request,
      # so it neither rewrites the lockfile before this reads it nor hides the
      # problem -- a dropped entry it does notice fails that step instead, which
      # is the same loud outcome with a vaguer message.
      - name: Assert no catalog entry vanished from the lockfile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:pnpm-lock.yaml" > "$RUNNER_TEMP/base-lock.yaml"
          git show 'HEAD:pnpm-lock.yaml' > "$RUNNER_TEMP/head-lock.yaml"
          node ./scripts/git/catalog-integrity.mjs lockfile \
            --baseline "$RUNNER_TEMP/base-lock.yaml" \
            --current "$RUNNER_TEMP/head-lock.yaml"

      - name: Sync dependencies
        run: |
          # `syncpack fix` aligns the declared ranges in package.json files. It
          # no longer asserts anything about versions -- the catalogs do that --
          # so what it fixes here is formatting and field order.
          pnpm syncpack fix
          # A package this workspace catalogues twice -- narrowly in a semantic
          # catalog, widely in `peers` -- must resolve to one version. A
          # dependabot PR bumps the narrow range only, and a catalog entry in
          # the lockfile is a *pin*, so the wide range keeps the version it
          # had. `pnpm dedupe` below cannot collapse that: obeying the pin is
          # what a catalog is for. To drop the pins lets the install resolve
          # the two together, and it must come first for the same reason --
          # dedupe cannot repair what a pin still holds.
          node ./scripts/git/dedupe-catalog-pins.mjs
          pnpm install --no-frozen-lockfile
          # `dedupe` collapses the resolutions in the lockfile. A dependabot PR
          # only re-resolves the package it bumps, so open ranges elsewhere keep
          # their stale versions. For peer-dependent packages (vite, webpack,
          # unplugin, ...) pnpm then keeps one copy per distinct peer set, and
          # two copies of the same version produce nominally different types --
          # e.g. `Plugin` from vite@8.1.5(@types/node@26.1.0) is not assignable
          # to `Plugin` from vite@8.1.5(@types/node@26.1.2).
          pnpm dedupe
          # That the repair converged is not something the drop above can
          # promise. It selects no version -- each range resolves again on its
          # own -- so two ranges that no longer overlap would come back split.
          # This is not the "check after its own repair" the step above warns
          # off: that one must read the lockfile as dependabot wrote it, while
          # this one exists to read the repaired file, and it is cheaper to
          # fail here than to push a split and find it in `pr-validation`.
          node ./scripts/git/catalog-integrity.mjs duplicates

      - name: Commit changes if needed
        id: commit-changes
        run: |
          if git diff --quiet -- '**/package.json' pnpm-lock.yaml; then
            echo "No dependency changes detected"
            echo "changes_pushed=false" >> $GITHUB_OUTPUT
          else
            pnpm install --no-frozen-lockfile

            git add .
            git commit -m "fix(deps): sync dependencies" --no-verify
            git push
            echo "changes_pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: steps.commit-changes.outputs.changes_pushed == 'true' # Only run if changes were pushed
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "I've synchronized dependencies across the workspace to ensure consistency."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
