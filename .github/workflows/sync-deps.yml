name: Sync Dependencies

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - edited
    paths:
      - '**/package.json'
      - '**/pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.ref }}
  cancel-in-progress: true

jobs:
  sync-dependencies:
    runs-on: ubuntu-24.04-arm
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Git configure
        uses: ./.github/actions/gitconfig

      - name: Sync dependencies
        run: |
          # `syncpack fix` aligns the declared ranges in package.json files.
          pnpm syncpack fix
          # `dedupe` collapses the resolutions in the lockfile. A dependabot PR
          # only re-resolves the package it bumps, so open ranges elsewhere keep
          # their stale versions. For peer-dependent packages (vite, webpack,
          # unplugin, ...) pnpm then keeps one copy per distinct peer set, and
          # two copies of the same version produce nominally different types --
          # e.g. `Plugin` from vite@8.1.5(@types/node@26.1.0) is not assignable
          # to `Plugin` from vite@8.1.5(@types/node@26.1.2).
          pnpm dedupe

      - name: Commit changes if needed
        id: commit-changes
        run: |
          if git diff --quiet -- '**/package.json' pnpm-lock.yaml; then
            echo "No dependency changes detected"
            echo "changes_pushed=false" >> $GITHUB_OUTPUT
          else
            pnpm install --no-frozen-lockfile

            git add .
            git commit -m "fix(deps): sync dependencies" --no-verify
            git push
            echo "changes_pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: steps.commit-changes.outputs.changes_pushed == 'true' # Only run if changes were pushed
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "I've synchronized dependencies across the workspace to ensure consistency."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
