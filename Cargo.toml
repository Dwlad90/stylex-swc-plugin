[workspace]
resolver = "2"

members = ["crates/postcss-value-parser", "crates/stylex-*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Dwlad90/stylex-swc-plugin.git"
rust-version = "1.97.0"
version = "0.18.6"


# Set the options for dependencies (not crates in the workspace), this mostly impacts cold builds
[profile.dev.package."*"]
opt-level = 1

# Set the settings for build scripts and proc-macros.
[profile.dev.build-override]
opt-level = 3

# Profile for the criterion benches. Cargo derives it from `release`, so it
# inherits the settings below unless it states its own.
[profile.bench]
debug = true
lto = true

# Cancels the `strip = "symbols"` this profile inherits from `release`. Without
# it a bench target generates full debug information and then has it stripped,
# which leaves a flamegraph over a bench binary with no symbols at all. The
# `release` strip is for the published `.node`, which nobody profiles.
strip = "none"

# Profile for the `.node` addons published to npm. Trades build time for transform
# throughput: CI builds once, consumers pay per file on every build.
[profile.release]
# Single codegen unit per crate, merged by LTO: the optimizer sees everything at once.
codegen-units = 1

# Fat LTO. Enables cross-crate inlining into SWC's visitor traversal, the hot path.
# This setting reaches only a final artifact. A crate that also emits a reusable
# `rlib` is not final, so it gets no LTO, and cargo prints no warning. The addon
# is `cdylib` only to keep this setting effective.
lto = true

# Optimize for speed. Never "z"/"s" — they optimize for size by slashing the inliner
# budget.
opt-level = 3

# Safe: panics are formatted into a message before reaching JS, so no backtrace is
# symbolized at runtime.
strip = "symbols"

# Deliberately NOT set:
#
# panic = "abort" — crates/stylex-rs-compiler/src/lib.rs wraps the transform in
#   `catch_unwind` to turn StyleX diagnostics into `napi::Error`. Unwinding is that
#   transport; "abort" removes it. Verified: one unbound `stylex.create()` then kills
#   Node with SIGABRT instead of throwing a catchable error.
#
# -C target-cpu=native — these binaries ship to arbitrary machines, runner hardware
#   is not pinned, and several targets are cross-compiled. Measured no gain anyway
#   (`apple-m1` gave a byte-identical binary): this workload chases pointers through
#   boxed AST nodes, so there is nothing to vectorize.

[workspace.dependencies]
anyhow = "1.0.102"
boa_engine = { version = "0.22.0", features = ["annex-b"] }
color-backtrace = { version = "0.7.2" }
colored = { version = "3.1.1" }
criterion = { version = "0.8", features = ["html_reports"] }
cssparser = { version = "0.37.0" }
ctor = "1.0.7"
derive_more = { version = "2.1.1", features = ["display"] }
env_logger = "0.11.10"
fancy-regex = "0.19.0"
glob = { version = "0.3.3" }
# Root collation for the pseudo-key comparator. Six of its crates are new to
# this workspace; the other 26 in its tree already arrive through SWC's
# `idna_adapter`. `crates/stylex-css/src/utils/pre_rule.rs` costs the choice
# against the alternative it was measured against.
# `unstable` is an empty marker feature -- it pulls no extra crates -- and it
# gates `CollatorBorrowed::new_root`, the only constructor for root collation
# that cannot fail. `Collator::try_new` returns a `Result` whose `Err` means the
# compiled CLDR data this crate carries is absent, which is a build-time
# dependency rather than a runtime state: unreachable, untestable, and therefore
# an uncoverable region in a workspace that excludes nothing from coverage.
# `new_root` has no such arm. See `crates/stylex-css/src/utils/pre_rule.rs`.
#
# The cost is an API the crate reserves the right to change in a minor release.
# `Cargo.lock` is committed, so that can only surface on a deliberate
# `cargo update`, and the failure is a compile error naming this line rather than
# anything silent.
icu_collator = { version = "2.3.1", features = ["unstable"] }
indexmap = { version = "2.14.0", features = ["serde"] }
insta = { version = "1.47.2" }
lazy_static = "1.5.0"
log = "0.4.32"
md5 = { version = "0.8.0" }
murmur2 = { version = "0.1.0" }
once_cell = { version = "1.21.4" }
path-clean = { version = "1.0.1" }
phf = { version = "0.14.0" }
pretty_env_logger = "0.5.0"
radix_fmt = { version = "1.0.0" }
rust_decimal = { version = "1.42.0", features = ["serde"] }
rustc-hash = "2.1.2"
serde = "1.0.228"
serde_json = "1.0.150"
serde_plain = "1.0.2"
serial_test = { version = "4.0.1" }
# Already in the graph through SWC, which uses it for the same reason: a list
# that is a handful of items in every real case does not need the heap. Named
# here so the span cache key can sort its names on the stack.
smallvec = { version = "1.15.1" }
# Already in the graph through swc_ecma_parser, which grows the stack for the same
# reason: a recursive walk over a nested expression must not be bounded by the
# thread's stack. Named here so the evaluator can depend on it directly.
stacker = "0.1.24"
swc_compiler_base = { version = "62.0.0" }
swc_config = { version = "6.0.0" }
swc_core = { version = "75.0.0" }
swc_ecma_parser = { version = "43.0.0" }
url = "2.5.8"
# The global allocator for the shipped `.node`. Keeps the system allocator on
# *every* musl target -- `x86_64-unknown-linux-musl` is the one this repo
# publishes -- because mimalloc segfaults on ARM64 musl (microsoft/mimalloc#556)
# and jemalloc misbehaves against musl threads (jemalloc/jemalloc#1443).
# Depending on `mimalloc` directly would take mimalloc on musl too, which is the
# configuration SWC found unshippable. It also takes jemalloc rather than
# mimalloc on `armv7-unknown-linux-gnueabihf`, which this repo does not publish
# today: adding that target changes the allocator without a change here.
swc_malloc = { version = "1.2.5" }
swc_sourcemap = { version = "10.0.2" }
testing = "25.0.0"
thiserror = "2.0.18"
# The structural key's hasher. 128-bit output in one pass, where two salted
# `DefaultHasher` states cost two -- see `stylex-utils/src/hash.rs`.
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
# convert_case = { version = "0.11.0" }
# .cargo/config defines few alias to build plugin.
# cargo build-wasi generates wasm-wasi32 binary
# cargo build-wasm32 generates wasm32-unknown-unknown binary.

# wasm-pack build --target web --dev -d dist --out-name index

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

# Workspace-wide clippy gates. Rules enforced here:
# - performance: avoid hidden allocations / clones in hot paths
# - correctness: prefer explicit conversion paths and idiomatic iterators
# Test code can opt out via `#[cfg_attr(test, allow(<lint>))]` on the offender.
[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
format_in_format_args = "warn"
inefficient_to_string = "warn"
manual_string_new = "warn"
needless_collect = "warn"
redundant_clone = "warn"
