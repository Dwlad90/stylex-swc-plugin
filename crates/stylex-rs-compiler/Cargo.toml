[package]
description = "StyleX rust compiler with SWC"
edition.workspace = true
license.workspace = true
name = "stylex_rs_compiler"
repository.workspace = true
rust-version.workspace = true
version.workspace = true


[lib]
# `cdylib` only. Node loads this crate as the `.node` addon, and nothing links it
# as a Rust library. Do not add an `rlib`: LTO runs only on a final artifact, and
# a crate that also emits a reusable `rlib` is not final, so rustc then receives
# no `-C lto` and the fat LTO of `profile.release` does not run. See
# `guidelines/STRUCTURE.md` for what that measured.
crate-type = ["cdylib"]
doctest = false


[dependencies]
log.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_plain.workspace = true
swc_compiler_base = { workspace = true, features = ["node"] }
swc_core = { workspace = true, features = [
  "common",
  "ecma_codegen",
  "ecma_parser",
  "ecma_plugin_transform",
  "ecma_utils",
] }
swc_ecma_parser = { workspace = true, features = ["verify"] }
swc_malloc.workspace = true
swc_sourcemap.workspace = true

indexmap.workspace = true
napi = { version = "3.9.0", features = ["compat-mode", "serde-json"] }
napi-derive = "3.5.6"
# The metadata carries a `defineConsts` constant as JSON, so that the kind the
# author gave it survives the trip out of the compiler. `preserve_order` is
# what keeps an object constant in the order the author wrote it, and the
# allocator checks read `package.json` with the same parser.
serde_json = { workspace = true, features = ["preserve_order"] }
stylex_ast = { path = "../stylex-ast" }
stylex_enums = { path = "../stylex-enums" }
stylex_js = { path = "../stylex-js" }
stylex_logs = { path = "../stylex-logs" }
stylex_macros = { path = "../stylex-macros" }
stylex_regex = { path = "../stylex-regex" }
stylex_state = { path = "../stylex-state" }
stylex_structures = { path = "../stylex-structures" }
stylex_stylesheet = { path = "../stylex-stylesheet" }
stylex_transform = { path = "../stylex-transform" }
stylex_types = { path = "../stylex-types" }
stylex_utils = { path = "../stylex-utils" }


# The allocator for the one published target `swc_malloc` leaves on the system
# one. Target-gated rather than declared beside the others, so no musl target
# but this one links it. The workspace manifest carries the reason.
[target.'cfg(all(target_os = "linux", target_env = "musl", target_arch = "x86_64"))'.dependencies]
mimalloc.workspace = true

# mimalloc v2, not v3, on macOS. On macOS, `swc_malloc` sets the global
# allocator, not this crate. The `v2` feature unifies with the `mimalloc` that
# `swc_malloc` selects, so the addon still links one mimalloc.
#
# On macOS, mimalloc v3 keeps the heap of a thread in the fixed TLS slots 108
# and 109. These slots belong to the process, not to the image. A build loads
# this addon and `@swc/core` into one Node process. From 1.16.17, `@swc/core`
# links its own mimalloc v3. The second copy to load then reads the heap of the
# first copy. The process stops with SIGSEGV, in each load order.
#
# v2 keeps the heap in `__thread` storage, which is private to each image. v2
# uses a fixed TLS slot (89) only with the `override` feature. Do not set
# `override`: it causes the same crash again.
#
# Paired benchmark on darwin arm64, 66 fixtures, geometric mean of the time
# against v3: v2 is 1.03x. The v3 pthread-key model (`-DMI_HAS_TLS_SLOT=0`) also
# isolates the copies, but it is 1.12x. Also, microsoft/mimalloc#1302 reports a
# crash at process exit for that model.
#
# `__test__/sharedProcessAllocator.spec.ts` loads this addon and `@swc/core`
# into one process. It fails when the two copies share a slot.
[target.'cfg(target_vendor = "apple")'.dependencies]
mimalloc = { workspace = true, features = ["v2"] }

[build-dependencies]
napi-build = "2.3.1"

[package.metadata.cargo-machete]
ignored = ["napi-build"]

[lints]
workspace = true
