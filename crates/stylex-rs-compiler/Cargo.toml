[package]
description = "StyleX rust compiler with SWC"
edition.workspace = true
license.workspace = true
name = "stylex_compiler_rs"
repository.workspace = true
rust-version.workspace = true
version.workspace = true


[lib]
# The only crate that needs a C-ABI library: the `.node` addon Node loads. Every
# other crate here is `rlib` only -- a `cdylib` nothing links exports its symbols
# as preemptible, which keeps the caller from optimizing into them.
crate-type = ["cdylib", "rlib"]
doctest = false


[dependencies]
log.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_plain.workspace = true
swc_compiler_base = { workspace = true, features = ["node"] }
swc_core = { workspace = true, features = [
  "common",
  "ecma_codegen",
  "ecma_parser",
  "ecma_plugin_transform",
  "ecma_utils",
] }
swc_ecma_parser = { workspace = true, features = ["verify"] }
swc_malloc.workspace = true
swc_sourcemap.workspace = true

indexmap.workspace = true
napi = { version = "3.9.0", features = ["compat-mode"] }
napi-derive = "3.5.6"
stylex_ast = { path = "../stylex-ast" }
stylex_enums = { path = "../stylex-enums" }
stylex_logs = { path = "../stylex-logs" }
stylex_macros = { path = "../stylex-macros" }
stylex_regex = { path = "../stylex-regex" }
stylex_structures = { path = "../stylex-structures" }
stylex_transform = { path = "../stylex-transform" }
stylex_types = { path = "../stylex-types" }
stylex_utils = { path = "../stylex-utils" }


[dev-dependencies]


[build-dependencies]
napi-build = "2.3.1"

[package.metadata.cargo-machete]
ignored = ["napi-build"]

[lints]
workspace = true
