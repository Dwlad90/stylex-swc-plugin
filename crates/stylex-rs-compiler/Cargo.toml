[package]
description = "StyleX rust compiler with SWC"
edition.workspace = true
license.workspace = true
name = "stylex_compiler_rs"
repository.workspace = true
rust-version.workspace = true
version.workspace = true


[lib]
# `cdylib` only. Node loads this crate as the `.node` addon, and nothing links it
# as a Rust library. Do not add an `rlib`: LTO runs only on a final artifact, and
# a crate that also emits a reusable `rlib` is not final, so rustc then receives
# no `-C lto` and the fat LTO of `profile.release` does not run. See
# `guidelines/STRUCTURE.md` for what that measured.
crate-type = ["cdylib"]
doctest = false


[dependencies]
log.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_plain.workspace = true
swc_compiler_base = { workspace = true, features = ["node"] }
swc_core = { workspace = true, features = [
  "common",
  "ecma_codegen",
  "ecma_parser",
  "ecma_plugin_transform",
  "ecma_utils",
] }
swc_ecma_parser = { workspace = true, features = ["verify"] }
swc_malloc.workspace = true
swc_sourcemap.workspace = true

indexmap.workspace = true
napi = { version = "3.9.0", features = ["compat-mode"] }
napi-derive = "3.5.6"
stylex_ast = { path = "../stylex-ast" }
stylex_enums = { path = "../stylex-enums" }
stylex_logs = { path = "../stylex-logs" }
stylex_macros = { path = "../stylex-macros" }
stylex_regex = { path = "../stylex-regex" }
stylex_structures = { path = "../stylex-structures" }
stylex_transform = { path = "../stylex-transform" }
stylex_types = { path = "../stylex-types" }
stylex_utils = { path = "../stylex-utils" }


[dev-dependencies]


[build-dependencies]
napi-build = "2.3.1"

[package.metadata.cargo-machete]
ignored = ["napi-build"]

[lints]
workspace = true
