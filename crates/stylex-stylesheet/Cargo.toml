[package]
description = "The StyleX stylesheet step: the rules a compile emits, assembled into one sheet"
edition.workspace = true
license.workspace = true
name = "stylex_stylesheet"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
aho-corasick.workspace = true
icu_collator.workspace = true
indexmap.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true

stylex_constants = { path = "../stylex-constants" }
stylex_css_parser = { path = "../stylex-css-parser" }
stylex_js = { path = "../stylex-js" }
stylex_regex = { path = "../stylex-regex" }
stylex_utils = { path = "../stylex-utils" }

[dev-dependencies]
criterion.workspace = true
# The tests read their rules and configs from JSON.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
stylex_js = { path = "../stylex-js", features = ["serde"] }
swc_malloc.workspace = true

[[bench]]
harness = false
name = "process_bench"

[lints]
workspace = true
