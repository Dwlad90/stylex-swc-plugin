packages:
  - apps/*
  - crates/*
  - packages/*
  # Depth 3, so `packages/*` does not reach it. Listed explicitly because
  # `cleanupUnusedCatalogs` below decides what is used by asking pnpm, and pnpm
  # only knows about workspace members: outside the globs the playground's two
  # `catalog:` references resolve for nobody, and the next install deleted
  # `bundlers.vite-plugin-inspect` -- declared here and nowhere else -- leaving
  # the manifest pointing at an entry that no longer exists. Adding it is also
  # what makes `pnpm -C playground run dev` (the `play` script in
  # `packages/unplugin`) install anything at all.
  - packages/unplugin/playground
autoInstallPeers: true
# `prefer`, deliberately not `strict`. Strict makes a plain `pnpm add <dep>`
# fail whenever the dependency is not already catalogued, and with named
# catalogs the fix is a judgement call about *which* catalog -- one the error
# cannot make for you. `prefer` reuses the catalogued range automatically when
# there is one, and leaves teaching the convention to a check that can name the
# file, the dependency and a suggested catalog. That check is
# `scripts/git/catalog-integrity.mjs`, which pre-commit and CI both run through
# `scripts/git/version-mismatch-check.sh`.
catalogMode: prefer
# Every manifest now references a catalog, so an entry nothing references is
# rot with no reason to survive and the next install removes it. What "nothing
# references" means is worth stating: pnpm reads the workspace *members*, not
# the manifests syncpack lints -- the two sets differ, which is why the
# playground is listed explicitly above.
cleanupUnusedCatalogs: true
dedupePeerDependents: true
linkWorkspacePackages: deep
minimumReleaseAge: 4320
verifyDepsBeforeRun: false
engineStrict: true

minimumReleaseAgeExclude:
  - '@octokit/*'
  - '@yuku-codegen/*'
  - '@yuku-parser/*'
  - '@yuku-toolchain/types@0.8.2'
  - '@jsonjoy.com/fs-core@4.66.1'
  - '@jsonjoy.com/fs-fsa@4.66.1'
  - '@jsonjoy.com/fs-node-builtins@4.66.1'
  - '@jsonjoy.com/fs-node-to-fsa@4.66.1'
  - '@jsonjoy.com/fs-node-utils@4.66.1'
  - '@jsonjoy.com/fs-node@4.66.1'
  - '@jsonjoy.com/fs-print@4.66.1'
  - '@jsonjoy.com/fs-snapshot@4.66.1'
  - 'memfs@4.66.1'
  - 'tsx@4.23.5'
  - 'webpack-dev-middleware@8.1.1'
  - 'yuku-ast@0.8.2'
  - 'yuku-codegen@0.8.2'
  - 'yuku-parser@0.8.2'
nodeVersion: 24.18.0
preferWorkspacePackages: true
resolvePeersFromWorkspaceRoot: true
saveWorkspaceProtocol: rolling
strictPeerDependencies: false

# Every external dependency version in this workspace is declared here, once,
# by name -- manifests reference these entries with the `catalog:<name>`
# protocol instead of repeating a literal range. Drift stops being something
# to detect and becomes something you cannot express: you cannot diverge from
# a constant you reference by name. pnpm rewrites these references into real
# ranges during `pnpm pack` and `pnpm publish`, so nothing reaches npm
# consumers as a catalog reference.
#
# There is no default catalog. Every dependency has exactly one *development*
# range, in exactly one of the seven semantic catalogs below. `peers` is cut on
# a different axis and is not an eighth sibling of those seven -- see below.
#
# The seven are cut by what a dependency is *for* where it is referenced, not
# by who publishes it. Two boundaries are worth stating because the names
# alone do not settle them:
#
#   - `bundlers` is anything that participates in producing a build artifact --
#     the bundlers themselves and the loader/plugin ecosystem around them, plus
#     the build orchestrators (`turbo`, `tsdown`). `tooling` is what you run
#     *at* the repository rather than through a build: linters, formatters,
#     release and hook plumbing.
#   - `runtime` is libraries our own shipped code imports at run time
#     (`chalk`, `fast-glob`, `picomatch`, `postcss`, `@stylexjs/*`). It does
#     not mean "runs in a browser" -- most of this repo is a compiler, so its
#     run time is a build step in somebody else's project.
#
# `peers` exists because a catalog key is a package name, so one package
# needing two ranges needs two catalogs. Nine packages are declared twice with
# genuinely different intent -- a narrow range we develop against and a wide
# range we accept from consumers. Those nine appear in a semantic catalog for
# their development range *and* in `peers` for the consumer range; that pairing
# is the only way one package legitimately appears twice. A package declared
# twice at the *same* range (`next-rspack`) is not one of them and has no
# `peers` entry.
#
# Syncpack no longer asserts anything about versions, and `.syncpackrc`'s group
# labels point here for the reason. Do not restore those checks. Removing its
# ignore-everything groups does not re-enable a useful check -- it restores
# syncpack's default of flagging any dependency whose specifier *string*
# differs across manifests, which fails on two states that are both correct:
# mid-migration, where a dependency reads `catalog:bundlers` in a migrated
# manifest and a literal range in one not yet migrated; and permanently, on the
# nine packages above, which read `catalog:peers` in `peerDependencies` and
# their semantic catalog everywhere else. Syncpack keeps its formatting,
# sorting and field-ordering duties, which live in `syncpack format` and are
# untouched by any of this.
